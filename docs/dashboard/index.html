docs in git |\n| `.env.example` exists | ✅ Present |\n| `.cursor/mcp.json` valid JSON | ✅ Valid |\n| `apps/backend/app/openapi.json` valid JSON | ✅ Valid |\n\n---\n\n## 2. Secret Scan\n\nScanned: `apps/**/*.{py,ts,tsx,js}`, `packages/**/*.{py,ts,tsx,js}`  \nPattern: `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`\n\nAll hits are environment variable reads — no hardcoded values:\n- `apps/backend/redis_client.py` — `password=REDIS_PASSWORD` (reads env var)\n- `apps/backend/main.py` — `api_key = os.getenv(\"METRICS_API_KEY\", \"\")` (reads env var)\n- `apps/backend/init_db.py` — `admin_password = os.getenv(\"ADMIN_PASSWORD\")` (reads env var)\n- `packages/ai/*.py` — `api_key=api_key` passed from env (reads env var)\n\n**Result**: ✅ Clean\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (npm audit)\n```\n2 moderate severity vulnerabilities (react-router 6.0.0 – 7.17.0)\n  - CVE-2025-68470 bypass: Open redirect via backslash in <Link> and useNavigate\n  - GHSA-337j-9hxr-rhxg: Arbitrary Constructor Injection via deserializeErrors() in SSR hydration\n```\n\n**Status**: Both already tracked and mitigated:\n- GHSA-wrjc-x8rr-h8h6 / CVE-2025-68470: code-mitigated via **AWD-M-328** (done 2026-07-27) — `sanitizeRedirectPath` added to `sanitizer.ts` and applied in `LoginPage.tsx`\n- GHSA-337j-9hxr-rhxg: **N/A** — Awade is CSR-only, no SSR hydration path\n\nNo new action required. Consistent with all scans since 2026-08-04.\n\n### Backend (pip outdated — notable)\n| Package | Installed | Latest | Risk |\n|---------|-----------|--------|------|\n| fastapi | 0.137.1 | 0.141.1 | Low — no known CVE in gap |\n| bcrypt | 4.3.0 | 5.0.0 | Low — major version, no CVE flagged |\n| google-genai | 1.14.0 | 2.19.0 | Low — major version, no CVE flagged |\n| PyJWT | 2.13.0 | current | ✅ current |\n| openai | 1.109.1 | current | ✅ current |\n| starlette | 1.3.1 | current | ✅ current |\n\nNo known CVEs identified in outdated packages. Staleness noted for dependency-security-agent.\n\n---\n\n## 4. OWASP Web Top 10\n\n### 1. Broken Access Control\nAll routers verified:\n- `admin.py` — router-level `dependencies=[Depends(require_admin)]` covers all 12 endpoints\n- `children.py` — `require_parent` applied to every route individually (lines 60, 72, 94, 109, 122, 136, 149, 165, 184, 198+)\n- `lesson_plans.py` — `require_educator` or `require_admin_or_educator` on every route\n- `users.py` — `get_current_active_user` / admin deps on every route\n- `auth.py` — signup/login/google/forgot-password/reset-password intentionally public ✅\n\n**Result**: ✅ No missing auth guards\n\n### 2. Cryptographic Failures\n- Passwords: bcrypt 4.3.0 ✅\n- Tokens: PyJWT 2.13.0, httpOnly cookies ✅\n- `cryptography` 50.0.0 (patched AWD-H-141, 2026-08-11) ✅\n\n### 3. Injection\n- All backend inputs typed via Pydantic schemas ✅\n- SQL: SQLAlchemy ORM — no raw f-string queries found ✅\n- Frontend: input sanitization via `sanitizer.ts` ✅\n\n### 4. Security Misconfiguration\n- Rate limiter (`limiter.py`) applied to all admin/AI endpoints ✅\n- CORS middleware present (`apps/backend/middleware/`) ✅\n\n### 5. Auth Failures\n- Account enumeration: guarded (auth routes return generic errors) ✅\n- JWT blacklisting via token_service.py ✅\n\n### 6. Logging & Monitoring\n- Sentry wired (AWD-H-01) ✅\n- Backend uses structured logger (not bare print) ✅\n- Frontend: most console.* gated behind `import.meta.env.DEV` ✅\n\n**Minor finding (L-level)**:\n- `useGenerateLessonResource.ts:57` — `console.warn('Polling failed temporarily', pollResponse.error)` — not DEV-gated; will log in production. No PII exposed, but adds noise.\n- `LessonPlanDetailPage.tsx:51` — `console.error('Error loading lesson plan:', err)` — not DEV-gated. No PII exposed.\n\nNeither exposes secrets or PII. Code hygiene only — not filing a new backlog item (no significant security risk; the error objects are internal FastAPI HTTPException details, not tokens or child data).\n\n---\n\n## 5. OWASP LLM Top 10 (AI_STACK = OpenAI GPT)\n\n### 1. Prompt Injection\nBoth prompts use delimiter isolation:\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: `<user_context>` tags around local_context (educator-supplied)\n- `PARENT_HELPER_PROMPT`: `<curriculum_data>` tags around all curriculum fields; explicit IMPORTANT note instructs model to treat delimited content as data only\n\n**Result**: ✅ Protected\n\n### 2. Insecure Output Handling\n- `validate_output()` (`gpt_service.py:408`) — json.loads + content-safety patterns applied to lesson resource AI output\n- `_validate_parent_guide()` (`gpt_service.py:769`) — two-pass validation (json.loads + schema check) for parent guide output\n\n**Result**: ✅ Output validated before persisting\n\n### 3. Sensitive Info Disclosure\n- No child IDs, tokens, or PII passed into system/user prompts ✅\n- Curriculum data only (grade level, topic, objectives) ✅\n\n### 4. Model DoS / Unbounded Consumption\n- Rate limiter applied to AI endpoints via `limiter.py` ✅\n- `OPENAI_TIMEOUT_SECONDS` env var caps request duration ✅\n\n### 5. Supply Chain\n- `openai==1.109.1` (pinned in requirements.txt) ✅\n- No unverified third-party LLM plugins ✅\n\n### 6. System Prompt Leakage\n- Prompts are in `packages/ai/prompts.py` (server-side only) — not exposed via API or frontend ✅\n\n---\n\n## 6. New Backlog Items Filed\n\n**None.** No new Critical or High findings this scan.\n\n---\n\n## 7. Open Security Items (active backlog)\n\n| ID | Title | Stage |\n|----|-------|-------|\n| H-73 | AI API key rotation date unknown | define |\n| H-79 | Venv + pytest setup in QA sandbox | discover |\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-19.md", "path": "../agentic/audits/security-report-2026-08-19.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-19", "content": "# Security Report — 2026-08-19\n\n**Agent**: security-agent  \n**Run time**: 2026-08-19 06:07 BST  \n**Status**: ✅ PASS — No new Critical or High findings\n\n---\n\n## 1. CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| Sensitive files in git (`*.env *.key *.pem *.p12`) | ✅ None found |\n| `docs/private/` files in git | ✅ None found |\n| `.env.example` present | ✅ Exists |\n| `.cursor/mcp.json` valid JSON | ✅ Valid |\n| `apps/backend/app/openapi.json` valid JSON | ✅ Valid |\n\n---\n\n## 2. Secret Scan\n\nScanned `apps/` and `packages/` for hardcoded secrets (`sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`).\n\n**All matches are legitimate `os.getenv()` lookups or test fixtures:**\n\n| Location | Pattern | Verdict |\n|----------|---------|---------|\n| `apps/backend/redis_client.py:17` | `password=REDIS_PASSWORD` | ✅ Variable from `os.getenv(\"REDIS_PASSWORD\")` |\n| `apps/backend/main.py:183` | `api_key = os.getenv(...)` | ✅ Env var lookup |\n| `apps/backend/init_db.py:64,82` | `os.getenv(\"ADMIN_PASSWORD\")` | ✅ Env var lookup |\n| `packages/ai/providers/openai_provider.py:27,33` | `api_key = api_key or os.getenv(...)` | ✅ Env var lookup |\n| `packages/ai/providers/gemini_provider.py:30,37` | `api_key = api_key or os.getenv(...)` | ✅ Env var lookup |\n| `apps/backend/tests/conftest.py:297` | `api_key=\"test\"` | ✅ Test fixture — mock key |\n\n**Result: No hardcoded secrets.**\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (`npm audit --production`)\n\n```\nreact-router 6.0.0 - 7.17.0\n  Severity: MODERATE\n  CVE-2025-68470 bypass — Open redirect via backslash in <Link> and useNavigate\n  GHSA-337j-9hxr-rhxg — Arbitrary Constructor Injection via deserializeErrors()\n```\n\n- **2 moderate vulnerabilities** in `react-router` / `react-router-dom`.\n- Previously tracked as **H-140** and noted code-mitigated via **M-328** (`sanitizeRedirectPath` in `apps/frontend/src/utils/sanitizer.ts`).\n- Upgrading to react-router v7+ would fix CVEs but is a breaking API change — deferred. No new action required.\n\n### Backend (`pip list --outdated` via venv)\n\nAll security-critical packages are current following recent sprints:\n- `cryptography==50.0.0` (H-141 — patched PYSEC-2026-3552/3553/3554)\n- `Pillow==12.3.0` (H-138)\n- `starlette==1.3.1` (H-126)\n- `PyJWT==2.13.0` (M-207)\n- `urllib3==2.7.0` (H-75, M-199)\n- `requests==2.33.0` (M-114)\n- `pydantic==2.10.6` (M-151)\n- `sqlalchemy==2.0.41` (M-152)\n- `bcrypt==4.3.0` (M-62)\n\nNo new backend CVEs detected.\n\n---\n\n## 4. OWASP Web Top 10\n\n| # | Category | Status | Notes |\n|---|----------|--------|-------|\n| A01 | Broken Access Control | ✅ | All routes have `Depends(require_*)` guards — parent/educator/admin correctly partitioned |\n| A02 | Cryptographic Failures | ✅ | bcrypt passwords, HS256 JWT, HTTPS only; reset tokens stored as SHA-256 hash |\n| A03 | Injection | ✅ | SQLAlchemy ORM throughout; `curriculum_structure.py` raw execute uses typed `union_all` — no user input in SQL |\n| A04 | Insecure Design | ✅ | Rate limits on all AI generation endpoints (5/min) and auth endpoints (5-10/min) |\n| A05 | Security Misconfiguration | ✅ | CORS: wildcard replaced by explicit localhost list in dev, env-driven in prod; `/metrics` behind API key (`secrets.compare_digest`) |\n| A06 | Vulnerable Components | ✅ | All backend CVEs addressed; 2 moderate frontend react-router CVEs code-mitigated (H-140/M-328) |\n| A07 | Auth Failures | ✅ | Enumeration-safe password reset (H-133); rate limits on login/signup/forgot-password; no JWT logged |\n| A08 | Software & Data Integrity | ✅ | `package-lock.json` and `requirements.txt` pinned and committed |\n| A09 | Logging & Monitoring | ✅ | Structured logger used; user IDs logged (not emails/names); Sentry wired (H-01); no raw JWT in logs |\n| A10 | SSRF | ✅ | No user-controlled URL fetching paths found |\n\n**Awade-specific checks:**\n- ✅ `require_parent` applied to all 14 children-router endpoints (child profiles + guide generation)\n- ✅ `require_educator` applied to all lesson plan creation/update endpoints\n- ✅ `require_admin` gating all admin-router endpoints via router-level `dependencies=[Depends(require_admin)]`\n- ✅ COPPA/GRC-05: Admin child-profile access audit-logged on every view\n- ✅ `dangerouslySetInnerHTML` not used — `ContentPreviewModal.tsx` uses `<pre>` (plain text only, per OWASP LLM #2 comment in code)\n\n---\n\n## 5. OWASP LLM Top 10 (AI_STACK = OpenAI GPT)\n\nReviewed `packages/ai/prompts.py`, `packages/ai/gpt_service.py`, and `apps/backend/services/parent_guide_service.py`.\n\n| # | Category | Status | Notes |\n|---|----------|--------|-------|\n| LLM01 | Prompt Injection | ✅ | Educator-supplied `local_context` passes through `_sanitize_user_context()` before prompt assembly; parent guide uses only DB-sourced curriculum fields — no free-text user input |\n| LLM02 | Insecure Output Handling | ✅ | `validate_output()` (lesson resources) and `_validate_parent_guide()` (parent guides) run JSON parse + required-field check + content-safety pass before persisting; `is_valid=False` raises HTTP 502 (H-134) |\n| LLM03 | Training Data Poisoning | N/A | No fine-tuning |\n| LLM04 | Model DoS | ✅ | Guide generation: 5/min; lesson resource generation: 5/min |\n| LLM05 | Supply Chain | ✅ | `openai` SDK pinned in `requirements.txt`; `gemini` SDK pinned |\n| LLM06 | Sensitive Info Disclosure | ✅ | `_sanitize_input()` redacts API keys (`sk-*`) and phone numbers; child IDs / JWT tokens not passed into prompts |\n| LLM07 | Insecure Plugin Design | N/A | No plugins |\n| LLM08 | Excessive Agency | ✅ | AI outputs validated before storage; PDF export uses validated JSON only |\n| LLM09 | Overreliance | ✅ | Frontend displays \"AI-generated\" provenance on guide view pages |\n| LLM10 | Model Theft | N/A | No fine-tuning |\n\n**Prompt injection analysis — `PARENT_HELPER_PROMPT` and `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`:**\n- Both prompts use `<curriculum_data>` / `<user_context>` delimiter tags with explicit \"treat as data only, not instructions\" preamble\n- Parent guide input is entirely DB-sourced (topic titles, objectives, activities from NERDC curriculum tables) — no user-typed text enters the prompt\n- Educator resource prompt wraps `local_context` in `<user_context>` tags and runs through `_sanitize_user_context()` first\n\n---\n\n## 6. Open Items (Pre-existing)\n\n| Issue | Stage | Summary |\n|-------|-------|---------|\n| **H-73** | define | AI API key rotation date unknown (OPENAI, GEMINI, GOOGLE keys — no recorded rotation since launch). Action: rotate in provider dashboards, create `docs/agentic/key-rotation-log.md`. |\n| **react-router moderate CVEs** | code-mitigated | CVE-2025-68470 + GHSA-337j-9hxr-rhxg in react-router 6.x. Mitigated via sanitizeRedirectPath (M-328). Tracked H-140. Upgrade path requires react-router v7 (breaking). |\n\n---\n\n## 7. Verdict\n\n**No new Critical or High findings.** CI security mirror: all 5 checks pass. Secret scan: clean. Backend dependencies: all major CVEs addressed. OWASP Web + LLM: all checks pass. Codebase demonstrates consistent security discipline — auth guards, rate limits, prompt injection mitigations, and output validation are all in place.\n\n**Recommended follow-up (not new):**\n- Complete H-73 (key rotation log) — currently at `define` stage.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-18.md", "path": "../agentic/audits/security-report-2026-08-18.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-18", "content": "# Security Audit Report — 2026-08-18\n\n**Agent**: security-agent  \n**Run date**: 2026-08-18  \n**Branch**: develop  \n**Scope**: CI security job mirror + Secret scan + OWASP Web Top 10 + OWASP LLM Top 10\n\n---\n\n## CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| `git ls-files` — no `*.env / *.key / *.pem / *.p12` | ✅ PASS |\n| `git ls-files` — no `docs/private/**` | ✅ PASS |\n| `.env.example` exists | ✅ PASS |\n| `.cursor/mcp.json` valid JSON | ✅ PASS |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS |\n\n---\n\n## Secret Scan\n\nScanned `apps/` and `packages/` for patterns: `sk_live`, `sk_test`, `AIza`, `password\\s*=`, `api_key\\s*=`.\n\nAll hits are **expected patterns** — no hardcoded secrets:\n\n| File | Pattern | Assessment |\n|------|---------|------------|\n| `apps/backend/redis_client.py:17` | `password=REDIS_PASSWORD` | Variable reference, not a literal |\n| `apps/backend/main.py:183` | `api_key = os.getenv(\"METRICS_API_KEY\", \"\")` | Env read, safe |\n| `apps/backend/init_db.py:64,82,87` | `admin_password = os.getenv(...)` / `getpass.getpass(...)` | Env read / interactive prompt, safe |\n| `apps/backend/tests/conftest.py:297` | `api_key=\"test\"` | Test fixture placeholder, safe |\n| `packages/ai/providers/gemini_provider.py:30,37` | `self.api_key = api_key or os.getenv(\"GEMINI_API_KEY\")` | Env read, safe |\n| `packages/ai/gpt_service.py:200,202` | Provider constructors reading `api_key` arg | Env-sourced arg, safe |\n| `packages/ai/providers/openai_provider.py:27,33` | `self.api_key = api_key or os.getenv(\"OPENAI_API_KEY\")` | Env read, safe |\n\n**Result: No hardcoded secrets detected. ✅**\n\n---\n\n## Dependency Audit\n\n### Frontend (npm)\n```\n2 moderate severity vulnerabilities:\n  - react-router 6.0.0–7.17.0: GHSA-wrjc-x8rr-h8h6 (open redirect via backslash — code-mitigated via AWD-M-328 sanitizeRedirectPath)\n  - react-router 6.0.0–7.17.0: GHSA-337j-9hxr-rhxg (SSR deserialization — N/A, Awade is CSR-only)\n```\n\nBoth CVEs are pre-existing, tracked (AWD-M-328 — done 2026-07-27), and mitigated at the code level. No new action required.\n\n### Backend (pip core dependencies)\n\n| Package | Installed | Notes |\n|---------|-----------|-------|\n| fastapi | 0.137.1 | Current |\n| PyJWT | 2.10.1 | Current |\n| bcrypt | 4.3.0 | Current |\n| SQLAlchemy | 2.0.43 | Current |\n| openai | 1.108.2 | Current |\n\nNo critical or high CVEs in Awade's core backend dependencies.\n\n---\n\n## OWASP Web Top 10\n\n### A01 — Broken Access Control ✅\n- Every non-public route uses a `Depends(...)` auth guard:\n  - `require_parent` — all `/children/**` and `/guides/**` routes\n  - `require_educator` — all `/lesson-plans/**` routes\n  - `require_admin` or `require_admin_or_educator` — admin, curriculum write, user management\n  - `get_current_active_user` — curriculum/structure/subject/grade read routes\n- `/api/admin` router has `dependencies=[Depends(require_admin)]` at router level.\n- Public endpoints: `/`, `/health`, `/api/auth/login`, `/api/auth/signup`, `/api/auth/google`, `/api/auth/refresh`, `/api/auth/forgot-password`, `/api/auth/reset-password` — all legitimately public.\n- `/metrics` endpoint protected by `_metrics_api_key_auth` (METRICS_API_KEY env var, AWD-M-327).\n- Docs (`/docs`, `/redoc`) disabled in production (`ENVIRONMENT=production`).\n\n### A02 — Cryptographic Failures ✅\n- bcrypt 4.3.0 for passwords.\n- PyJWT 2.10.1 for tokens, signed with `SECRET_KEY`.\n- HTTPS enforced via Render/Vercel hosting.\n\n### A03 — Injection ✅\n- Pydantic schemas on all request bodies.\n- SQLAlchemy ORM used throughout; no f-string SQL construction observed.\n- AI prompts: user input isolated within XML-style delimiters (`<user_context>`, `<curriculum_data>`); `_sanitize_input()` strips delimiter-tag strings before interpolation.\n\n### A05 — Security Misconfiguration ✅\n- CORS configured with specific origin allowlist (no `*` in production path).\n- Docs disabled in production.\n- Metrics behind API key auth.\n- Rate limiting applied to all AI generation and sensitive endpoints.\n\n### A07 — Identification & Authentication Failures ✅\n- JWT lifecycle managed via `apps/backend/services/token_service.py`.\n- Refresh tokens tracked; logout route exists.\n- Google OAuth integrated.\n\n### A09 — Security Logging and Monitoring ✅\n- Sentry wired (AWD-H-01, commit 364762f); `SENTRY_DSN` activates it.\n- AuditMiddleware logs `request.state.user_id` for authenticated requests.\n- No PII in AI service logs — only curriculum metadata logged.\n- Admin actions written to `admin_audit_logs` table.\n\n---\n\n## OWASP LLM Top 10 (AI_STACK = OpenAI GPT)\n\n### LLM01 — Prompt Injection ✅\n- Both `COMPREHENSIVE_LESSON_RESOURCE_PROMPT` and `PARENT_HELPER_PROMPT` use XML-style delimiters (`<user_context>`, `<curriculum_data>`) with explicit `IMPORTANT` instructions treating tagged content as data only.\n- `_sanitize_input()` strips delimiter-tag strings from all user-supplied fields before interpolation.\n- `_sanitize_user_context()` additionally caps field length and removes injection markers.\n\n### LLM02 — Insecure Output Handling ✅\n- `validate_output()` (lesson resources) and `_validate_parent_guide()` (parent guides) run a two-pass check: injection marker scan → JSON parse → required-field check.\n- `_repair_json()` handles minor formatting issues without bypassing schema validation.\n- `ContentPreviewModal.tsx` renders AI output as plain text in `<pre>`, not HTML. No `dangerouslySetInnerHTML` usage found in frontend.\n\n### LLM04 — Model DoS / Unbounded Consumption ✅\n- Guide generation: `@limiter.limit(\"5/minute\")` on `POST /children/{child_id}/guides/generate`.\n- Lesson resource generation: `@limiter.limit(\"5/minute\")` on resource generate endpoint.\n- Lesson plan generate: `@limiter.limit(\"5/minute\")`.\n- Redis content cache reduces redundant LLM calls (`packages/ai/cache.py`).\n\n### LLM06 — Sensitive Information Disclosure ✅\n- No user PII, child profile IDs, tokens, or parent emails interpolated into AI prompts — only curriculum metadata (grade, subject, country, topic, learning objectives).\n- Child names not passed to AI prompts (confirmed: no `child_name` interpolation in `generate_parent_guide` or prompt templates).\n- Sentry configured with `sendDefaultPii: false` (AWD-M-202 confirmed).\n\n### LLM08 — Excessive Agency ✅\n- AI output validated before any DB write.\n- AI-generated content labelled as AI-generated in UI (AWD-M-196).\n- No AI agent with direct tool-call or side-effect capability.\n\n### LLM09 — Overreliance ✅\n- AI disclosure banners present on all AI-generated content views.\n\n---\n\n## Open Backlog Items (Security)\n\n| ID | Area | Summary | Stage |\n|----|------|---------|-------|\n| H-73 | Security / Secrets | AI API key rotation date unknown (GEMINI_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY) — no recorded rotation date | define |\n\n---\n\n## New Findings\n\nNone. No new Critical or High issues identified. No new backlog items filed.\n\nAll CI security checks pass. Auth, access control, rate limiting, CORS, prompt injection defences, and AI output validation all confirmed strong. React-router moderate CVEs remain in `npm audit` output but are fully mitigated (code-level + CSR-only confirmation, AWD-M-328 done).\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-08-18-H142.md", "path": "../code-reviews/review-2026-08-18-H142.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-08-18", "content": "# Code Review — 2026-08-18 · AWD-H-142 (nanoid override)\n\n**Verdict**: ⚠️ Refactor Recommended — 1 🟠 (blocking)\n**Files reviewed**: 2 (package.json, package-lock.json)\n**Branch**: fix/security/AWD-H-142-nanoid-vuln\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|---|---|---|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API / Config Design | 1 | 🟠 |\n\n## Findings\n\n### apps/frontend/package.json\n\n- **🟠 High** — `\"nanoid\": \">=3.3.18\"` override resolved to nanoid **6.0.1**, which declares `\"engines\": { \"node\": \"^22 || ^24 || >=26\" }`. CI runs Node 20 (`.github/workflows/ci.yml`). Semver-unrestricted `>=` across major versions is the root cause — the override jumped from v3 to v6.\n  **Fix**: Change to `\"nanoid\": \"^3.3.18\"` — stays on the v3 line (Node 10+ compatible), patches GHSA-2v37-7h3g-55p8, and avoids pulling a Node-22-only major.\n\n## Backlog Items Filed\nNone — this is a correctable issue within the same branch; the dev agent should fix inline before committing.\n\n## Notes\n- The security intent is correct: GHSA-2v37-7h3g-55p8 (nanoid < 3.3.18 infinite loop) is addressed.\n- package-lock.json correctly reflects the override in `node_modules/nanoid`.\n- Fix is a one-character change to package.json + re-run of `npm install`.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-17.md", "path": "../agentic/audits/security-report-2026-08-17.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-17", "content": "# Security Audit Report — 2026-08-17\n\n**Agent**: security-agent  \n**Run time**: 2026-08-17 06:00 (scheduled)  \n**Working branch**: develop\n\n---\n\n## Summary\n\nAll CI security checks pass. No new Critical or High findings. No new backlog items filed. React-router moderate CVEs (AWD-M-328) remain in npm audit output but are mitigated by the app's `sanitizeRedirectPath` helper and the non-SSR architecture. All auth, access-control, rate-limiting, CORS, prompt-injection, and AI output-validation controls confirmed strong.\n\n---\n\n## CI Security Job Mirror\n\n| Check | Result | Notes |\n|-------|--------|-------|\n| `git ls-files` — no `.env`/`.key`/`.pem`/`.p12` | ✅ PASS | Zero committed secret files |\n| `git ls-files` — no `docs/private/` | ✅ PASS | Private docs correctly gitignored |\n| `.env.example` exists | ✅ PASS | Present at repo root |\n| `.cursor/mcp.json` valid JSON | ✅ PASS | |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS | |\n\n---\n\n## Secret Scan\n\nScanned `apps/`, `packages/` for `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`.\n\n**Result: PASS** — All matches use `os.getenv()` / environment variable lookups, not hardcoded values. Test fixture `api_key=\"test\"` in `apps/backend/tests/conftest.py:297` is non-production mock. No live secrets found.\n\n---\n\n## Dependency Audit\n\n### Frontend (`npm audit --production`)\n\n| Severity | Count | Detail |\n|----------|-------|--------|\n| Moderate | 2 | `react-router` 6.x — CVE-2025-68470 (open redirect via backslash) + GHSA-337j-9hxr-rhxg (SSR injection) |\n| High | 0 | — |\n| Critical | 0 | — |\n\n**Status**: Tracked as AWD-M-328 (filed 2026-07-27). Compensating controls verified:\n- CVE-2025-68470: `sanitizeRedirectPath` in `apps/frontend/src/utils/sanitizer.ts` normalises backslashes and rejects protocol-relative paths before any navigation; LoginPage.tsx applies this before using redirect state.\n- GHSA-337j-9hxr-rhxg: SSR deserialization injection — does NOT apply; this is a client-side-rendered (CSR/Vite) app with no server-side React hydration.\n\nResidual risk: LOW. Fix (`npm audit fix`) available; dev-agent can action AWD-M-328 when capacity allows.\n\n### Backend (`pip list --outdated`)\n\nNo critical or high security patches outstanding. Key packages verified against `apps/backend/requirements.txt`:\n- `fastapi==0.137.1` — current (AWD-H-96 + AWD-H-126 addressed)\n- `pydantic==2.10.6` — current (AWD-M-151)\n- `sqlalchemy==2.0.41` — current (AWD-M-152)\n- `bcrypt==4.3.0` — current (AWD-M-62, CVE-2024-52400 patched)\n- `openai==1.109.1` — current (AWD-M-39)\n- `cryptography==50.0.0` — current (AWD-H-141)\n- `urllib3==2.7.0` — current (AWD-M-199)\n- `starlette` — pinned via fastapi (AWD-H-96)\n- `sentry-sdk[fastapi]==2.58.0` — current\n\n---\n\n## OWASP Web Top 10\n\n### A01 — Broken Access Control ✅\n- Every non-public route in all 11 routers carries `Depends(get_current_active_user)` or a stricter role dependency.\n- Role dependencies confirmed on all router files: `require_parent` on `children.py`, `require_educator` on `lesson_plans.py`, `require_admin` on `admin.py` (router-level), `require_admin_or_educator` on `contexts.py` and `users.py` endpoints.\n- Resource ownership verified: `get_child_or_404(db, child_id, parent_id)` in `children_shared.py` enforces parent_id == child.parent_id before returning any child resource.\n- Only public endpoints: `GET /` (health), `GET /health` — correct.\n\n### A02 — Cryptographic Failures ✅\n- Passwords hashed with bcrypt 4.3.0 (DoS CVE patched).\n- JWT signed with `SECRET_KEY` env var (HS256, PyJWT). Tokens not logged.\n- Auth tokens in httpOnly cookies (confirmed: `AuthContext.tsx:45` comment, `api.ts:97`).\n- Production served over HTTPS (Render + Vercel).\n\n### A03 — Injection ✅\n- All DB queries use SQLAlchemy ORM or parameterised `text()`. No f-string SQL found.\n- Request bodies validated by Pydantic schemas in `apps/backend/schemas/`.\n- AI template inputs pass through `_sanitize_input()` / `_sanitize_user_context()` in `gpt_service.py`.\n- Frontend: no `dangerouslySetInnerHTML` found. `ContentPreviewModal.tsx` explicitly uses `<pre>` plain text.\n\n### A04 — Insecure Design ✅\n- Threat model of AI-adjacent features is documented (`docs/security/prompt-injection-rules.md`).\n- AI outputs validated before persisting (two-pass: injection marker check + JSON parse + required-field check).\n- AI disclosure banners present on `GuideViewPage.tsx` and `EditLessonResourcePage.tsx` (AWD-M-196).\n\n### A05 — Security Misconfiguration ✅\n- CORS: when `ALLOWED_ORIGINS` env var is unset or `\"*\"`, backend falls back to a list of explicit localhost origins (not wildcard). Credentials mode enabled — safe.\n- Security headers set via `apps/frontend/vercel.json` (AWD-M-201): X-Content-Type-Options, X-Frame-Options, HSTS, CSP, Referrer-Policy, Permissions-Policy.\n- `/metrics` endpoint gated behind `Authorization: Bearer <METRICS_API_KEY>` (AWD-M-327); fails closed if env var unset.\n\n### A06 — Vulnerable and Outdated Components ✅ (with noted exception)\n- Backend: no outstanding critical/high CVEs per `pip list --outdated` cross-check with requirements.txt pins.\n- Frontend: 2 moderate react-router CVEs tracked under AWD-M-328 (compensating controls in place).\n- Open items: AWD-H-73 (AI API key rotation overdue), AWD-M-329 (setuptools), AWD-M-330 (httplib2) — all non-production paths.\n\n### A07 — Identification and Authentication Failures ✅\n- Account enumeration guard confirmed in `auth_service.py:235-236` and `auth_service.py:314-315` (generic messages for existing-account and OAuth-account checks).\n- Password reset uses generic success message (AWD-H-18 fix, `auth_service.py:418`).\n- Rate limits on auth routes: `POST /register` 10/min, `POST /login` 5/min, `POST /token/refresh` 20/min, `POST /forgot-password` 5/min, `POST /google` 5/min.\n\n### A09 — Security Logging and Monitoring ✅\n- Sentry wired (AWD-H-01, commit 364762f); `SENTRY_DSN` activates it.\n- AuditMiddleware writes `request.state.user_id` for authenticated requests (AWD-M-197).\n- No PII in AI service logs — only curriculum fields (subject, topic, country) logged; no child names or parent IDs.\n- Admin actions written to `admin_audit_logs` table.\n\n---\n\n## OWASP LLM Top 10 (AI_STACK = OpenAI GPT)\n\n### LLM01 — Prompt Injection ✅\n- Structured delimiters in both prompts: `<user_context>` / `<curriculum_data>` tags clearly separate data from instructions.\n- `_sanitize_input()` strips delimiter tag strings from all user-supplied fields before interpolation (AWD-M-198).\n- `_sanitize_user_context()` additionally caps length, strips PII patterns, and removes injection markers from educator-supplied context.\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT` and `PARENT_HELPER_PROMPT` both carry explicit `IMPORTANT` lines instructing the model to treat tagged content as data only.\n\n### LLM02 — Insecure Output Handling ✅\n- `validate_output()` (lesson resources) and `_validate_parent_guide()` (parent guides) both run a two-pass check: injection marker scan → JSON parse → required-field check.\n- `_repair_json()` handles minor trailing-comma issues without bypassing schema checks.\n- `ContentPreviewModal.tsx` renders AI output as plain text in `<pre>`, not HTML.\n\n### LLM04 — Model DoS / Unbounded Consumption ✅\n- Guide generation: `@limiter.limit(\"5/minute\")` on `POST /children/{child_id}/guides/generate`.\n- Lesson resource generation: `@limiter.limit(\"5/minute\")` on respective endpoint.\n- Redis content cache reduces redundant LLM calls (`packages/ai/cache.py`).\n\n### LLM06 — Sensitive Information Disclosure ✅\n- No user PII, child profile IDs, tokens, or parent emails interpolated into prompts — only curriculum metadata (grade, subject, country, topic, learning objectives).\n- `sendDefaultPii: false`, `maskAllText: true`, `blockAllMedia: true` set in Sentry config (AWD-M-202 confirmed).\n\n### LLM08 — Excessive Agency ✅\n- AI output validated before any DB write.\n- AI-generated content labelled as AI-generated in UI (AWD-M-196).\n- No AI agent with direct tool-call or side-effect capability in the current stack.\n\n### LLM09 — Overreliance ✅\n- AI disclosure banners present on all AI-generated content views.\n\n---\n\n## Open Backlog Items (Security)\n\n| ID | Area | Summary | Stage |\n|----|------|---------|-------|\n| H-73 | Security / Secrets | AI API key rotation date unknown (GEMINI_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY) | define |\n| M-328 | Security / DepSec | react-router moderate CVEs (GHSA-wrjc-x8rr-h8h6 open redirect bypass + GHSA-337j-9hxr-rhxg SSR injection) — mitigated | ready |\n| M-329 | Security / DepSec | setuptools outdated (78.1.1 → 83.0.0) — dev toolchain | define |\n| M-330 | Security / DepSec | httplib2 outdated (0.22.0 → 0.32.0) | define |\n\n---\n\n## New Findings\n\nNone. No new Critical or High issues identified. No new backlog items filed.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-16.md", "path": "../agentic/audits/security-report-2026-08-16.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-16", "content": "# Security Report — 2026-08-16\n\n**Agent:** security-agent  \n**Run time:** 2026-08-16 06:00  \n**Branch:** develop  \n**Last code commit:** `95a3858` (chore(records): dev-agent idle — no stage=ready items)  \n**Status:** ✅ Clean — no new Critical or High findings\n\n---\n\n## 1. CI Security Mirror\n\nMirrors the `security` job in `.github/workflows/ci.yml`:\n\n| Check | Result |\n|-------|--------|\n| `git ls-files \\| grep -E '\\.(env\\|key\\|pem\\|p12)$'` | ✅ CLEAN — no sensitive files tracked |\n| `git ls-files \\| grep \"docs/private/\"` | ✅ CLEAN — no private docs tracked |\n| `.env.example` exists | ✅ EXISTS |\n| `.cursor/mcp.json` valid JSON | ✅ VALID |\n| `apps/backend/app/openapi.json` valid JSON | ✅ VALID |\n\n---\n\n## 2. Secret Scan\n\nScanned `apps/` and `packages/` (`*.py`, `*.ts`, `*.tsx`, `*.js`) for `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`.\n\n**All matches are legitimate — no change since 2026-08-12:**\n- `apps/backend/redis_client.py` — `password=REDIS_PASSWORD` (env var read, not hardcoded)\n- `apps/backend/main.py` — `api_key = os.getenv(\"METRICS_API_KEY\", \"\")` (env var read)\n- `apps/backend/init_db.py` — `admin_password = os.getenv(...)` / `getpass.getpass(...)` (env var read or interactive prompt)\n- `apps/backend/tests/conftest.py` — `api_key=\"test\"` (test fixture — non-secret)\n- `packages/ai/providers/openai_provider.py` — `self.api_key = api_key or os.getenv(\"OPENAI_API_KEY\")` (SDK pattern)\n- `packages/ai/providers/gemini_provider.py` — `self.api_key = api_key or os.getenv(\"GEMINI_API_KEY\")` (SDK pattern)\n- `packages/ai/gpt_service.py` — `OpenAIProvider(api_key=api_key)` / `GeminiProvider(api_key=api_key)` (passing env-sourced value to provider)\n\n**Result: ✅ No hardcoded secrets.**\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (npm audit --production)\n\n```\n2 moderate severity vulnerabilities\n  react-router  6.0.0 - 7.17.0\n    GHSA-wrjc-x8rr-h8h6 — Open redirect via backslash in <Link> and useNavigate (CVE-2025-68470 bypass)\n    GHSA-337j-9hxr-rhxg — Arbitrary Constructor Injection via deserializeErrors() in SSR hydration\n```\n\n**Assessment:** Both already tracked as **AWD-M-328** (filed 2026-07-27). No change from previous scans.\n- Awade is a **client-side rendered** SPA — SSR hydration (GHSA-337j) is not exercised.\n- Redirect paths are app-controlled; attacker-influenced redirect values are not accepted from user input.\n- `sanitizeRedirectPath()` in `apps/frontend/src/utils/sanitizer.ts` provides additional defence (AWD-M-328).\n\n**Action:** No new backlog item required. M-328 remains the tracking item.\n\n### Backend (pip list --outdated)\n\nReviewed pip outdated output. Security-critical packages remain at pinned versions in `requirements.txt`:\n\n| Package | Pinned version | Notable CVEs addressed |\n|---------|---------------|----------------------|\n| `cryptography` | 50.0.0 | PYSEC-2026-3552/3553/3554 (AWD-H-141, done 2026-08-04) |\n| `fastapi` | 0.137.1 | CVE-2025-54121, CVE-2025-62727 (AWD-H-96) |\n| `starlette` | 1.3.1 | PYSEC-2026-host header injection (AWD-H-126) |\n| `weasyprint` | 69.0 | CVE-2026-49452 CSS-injection SSRF (AWD-M-325) |\n| `openai` | 1.109.1 | Latest 1.x SDK |\n\nThe pip `--outdated` list contains many Anaconda/system packages (aiobotocore, aiohttp, alembic) that are not in Awade's `requirements.txt` — these are environment noise, not Awade dependencies. No security-critical packages in `requirements.txt` have outstanding CVEs.\n\n**Result: ✅ No new backend CVEs detected.**\n\n---\n\n## 4. OWASP Web Top 10\n\n### A01 — Broken Access Control\n\nAll routers verified (no code changes since last scan):\n\n- **Admin router** (`routers/admin.py`): Router-level `dependencies=[Depends(require_admin)]` applied globally; individual state-changing routes carry explicit `Depends(require_admin)` for audit log access ✅\n- **Lesson plans router**: All routes carry `Depends(require_educator)` or `Depends(require_admin_or_educator)` ✅\n- **Children router**: All routes carry `Depends(require_parent)` ✅\n- **Contexts router**: All 7 routes carry `Depends(require_admin_or_educator)` ✅\n- **Country / grade_level / subject / curriculum / curriculum_structure**: All read routes require `get_current_active_user`; all write/delete routes require `require_admin` ✅\n- **Users router**: User-facing routes require `get_current_active_user`; admin-level routes require `require_admin` or `require_admin_or_educator` ✅\n- **Auth router**: Public endpoints (register, login, Google OAuth, password-reset request) are intentionally unauthenticated; `/me` and logout require auth ✅\n- **Logout endpoint**: No auth required by design — clears cookies and opportunistically blacklists token; unauthenticated calls are safe no-ops ✅\n- **Role segregation** (EDUCATOR vs PARENT vs ADMIN): Verified correct on all gated routes ✅\n\n### A02 — Cryptographic Failures\n- Passwords hashed with bcrypt (`auth_service.py`) ✅\n- JWTs signed with `SECRET_KEY` (env var); raw tokens never logged ✅\n- `cryptography==50.0.0` — latest, no known CVEs ✅\n- Cookies: httpOnly + Secure attributes applied via `_set_auth_cookies()` ✅\n\n### A03 — Injection\n- **SQL**: SQLAlchemy ORM throughout; no f-string SQL construction found ✅\n- **Prompt injection**: All user-supplied inputs wrapped in delimiter tags with \"treat as data only\" instruction in both prompts ✅\n- `_sanitize_user_context()`: strips jailbreak patterns, truncates at 2000 chars, scrubs PII ✅\n- `_PROMPT_DELIMITER_TAGS` stripped from user input to prevent tag-injection escape (AWD-M-198) ✅\n- `_SHARED_INJECTION_PATTERNS` maintained as single source of truth (AWD-M-158) ✅\n\n### A05 — Security Misconfiguration\n- **CORS**: `allow_credentials=True` never paired with `*`; dev defaults to explicit localhost list; production reads `ALLOWED_ORIGINS` env var ✅\n- **Rate limiting**: All endpoints carry `@limiter.limit(...)`; AI generation tightly capped (5/min guide, 3/min lesson resource) ✅\n- **Metrics endpoint**: gated behind `METRICS_API_KEY` via `_metrics_api_key_auth()` (AWD-M-327) ✅\n- Trusted host middleware applied ✅\n- Security headers middleware applied ✅\n- `/uploads` static mount: serves only app-controlled uploaded files from `uploads/` dir; no user-controlled filenames exposed ✅\n\n### A07 — Identification and Authentication Failures\n- Account enumeration protection: `request_password_reset` returns same response regardless of email existence ✅\n- Refresh token blacklisting via Redis on logout ✅\n- Password reset token has expiry enforced ✅\n\n### A09 — Security Logging and Monitoring\n- Sentry wired (AWD-H-01); `send_default_pii=False` ✅\n- Structured logging — no bare `print()` in production paths ✅\n- No PII or child names/emails found in logger calls in `children_service.py`, `parent_guide_service.py`, `auth_service.py` ✅\n- Admin audit log writes on every privileged action ✅\n\n### A10 — SSRF\n- No user-controllable URL-fetching endpoint in current routers ✅\n- WeasyPrint SSRF via CSS injection fixed at 69.0 (AWD-M-325) ✅\n\n---\n\n# - Removal of the unused `_simple_db` helper is clean housekeeping — it was never called by any test.\n- The `query_side` closure in `test_generate_guide_persist_db_error_raises_500` correctly handles the multi-call `mock_db.query` dispatch needed to distinguish `ParentGuide` existence check from `Topic` lookup. Approach is sound.\n- All 8 original tests are preserved with correct coverage; the split adds no net new tests but improves discoverability.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/private/agentic-operational/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-08-05-4707099-inloop.md", "path": "../code-reviews/review-2026-08-05-4707099-inloop.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-08-05", "content": "# Code Review — 2026-08-05 · 4707099 (in-loop)\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 9 (8 source/test + backlog.md)\n**Commits covered**: 4707099 (refactor/children/AWD-M-214-extract-parent-guide-service vs develop)\n**Mode**: in-loop — pre-merge review of feature branch diff\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 1 | 🟡 Medium |\n| Complexity | 0 | — |\n| Duplication | 1 | 🟡 Medium |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\n### apps/backend/services/parent_guide_service.py + apps/backend/services/children_service.py\n- **🟡 Medium** Lines 36–64 (parent_guide_service.py) / Lines 39–66 (children_service.py): `_verify_parent` and `_get_child_or_404` are byte-identical in both classes. The extraction produced two independent copies of the same guard logic. If the role-check logic (e.g. adding SUPER_ADMIN) or the 404 error detail changes in one service, the other silently drifts.\n  Fix: Extract to a standalone module helper `apps/backend/services/children_shared.py` exposing `verify_parent(user: User) -> None` and `get_child_or_404(db: Session, child_id: int, parent_id: int) -> ChildProfile`. Both services import and delegate. This is the approach used by `curriculum_service.py` / `learning_objective_service.py` after M-178. Filed AWD-M-331.\n\n### apps/backend/tests/test_children_service_guides.py\n- **🟢 Low** Line 12: Docstring says \"service class renamed from ParentGuideService to ParentGuideService\" — should read \"renamed from ChildrenService to ParentGuideService\". Not a logic error but misleading for future readers. No backlog item filed (trivial fix the dev agent can inline on the next touching commit).\n\n### apps/backend/tests/test_children_service_db_errors.py\n- **🟢 Low** Lines 25–238: `TestChildrenServiceDBErrors` class intermixes `ChildrenService` tests (CRUD) and `ParentGuideService` tests (toggle_bookmark, guide persist) in a single class named after only one service. Tests pass and are structurally valid, but the class name implies exclusive `ChildrenService` coverage. Filed AWD-M-332.\n\n## What's Correct\n\n- All 5 router handlers correctly instantiate `ParentGuideService(db)` instead of `ChildrenService(db)`.\n- All mock-patch paths updated to `apps.backend.services.parent_guide_service.AwadeGPTService` in 4 test files — patches will actually intercept the correct import.\n- `ChildrenService` imports properly pruned: `ParentGuide`, `ValidationError`, `AwadeGPTService`, `ParentGuideResponse/ListResponse/AIContent` all removed, no dead imports remain.\n- `_build_guide_ai_payload` return type `-> ParentGuideRequest` is valid — `ParentGuideRequest` is a `TypedDict` so a plain dict literal satisfies it.\n- `toggle_bookmark` DB error handling (rollback + HTTP 500) and `_persist_guide` reload-after-write guard both transferred intact.\n- 1039 backend tests pass, 0 failures — all patch paths verified working.\n\n## Backlog Items Filed\n\n- AWD-M-331: `_verify_parent` / `_get_child_or_404` byte-identical in both `ChildrenService` and `ParentGuideService` — extract to shared helper module\n- AWD-M-332: `TestChildrenServiceDBErrors` class mixes tests for two different services — rename or split\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-03.md", "path": "../agentic/audits/security-report-2026-08-03.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-03", "content": "# Security Report — 2026-08-03\n\n**Agent:** security-agent (scheduled, 6am run)\n**Date:** 2026-08-03\n**Status: ✅ CLEAN — No new findings. All CI checks pass.**\n\n---\n\n## 1. CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| Sensitive files in git (`*.env`, `*.key`, `*.pem`, `*.p12`) | ✅ PASS — none found |\n| `docs/private/` in git | ✅ PASS — none found |\n| `.env.example` present | ✅ PASS |\n| `.cursor/mcp.json` valid JSON | ✅ PASS |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS |\n\n---\n\n## 2. Secret Scan\n\nScanned `apps/`, `packages/` for `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`.\n\n**Result: ✅ Clean.** All matches are safe `os.getenv(...)` patterns (identical to yesterday's clean run):\n- `apps/backend/init_db.py` — `os.getenv(\"ADMIN_PASSWORD\")`, `os.getenv(\"EDUCATOR_PASSWORD\")` ✅\n- `apps/backend/redis_client.py` — `password=REDIS_PASSWORD` (variable, not literal) ✅\n- `apps/backend/main.py:183` — `os.getenv(\"METRICS_API_KEY\", \"\")` ✅\n- `apps/backend/tests/conftest.py:297` — `api_key=\"test\"` (test fixture only) ✅\n- `packages/ai/providers/openai_provider.py` — `os.getenv(\"OPENAI_API_KEY\")` ✅\n- `packages/ai/providers/gemini_provider.py` — `os.getenv(\"GEMINI_API_KEY\")` ✅\n\nNo hardcoded secrets.\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (`npm audit --production`)\n\n`react-router` and `react-router-dom` 6.30.4 — 2 moderate CVEs persist:\n- **GHSA-wrjc-x8rr-h8h6** — Open redirect via backslash in `<Link>` / `useNavigate`\n- **GHSA-337j-9hxr-rhxg** — Arbitrary Constructor Injection via `deserializeErrors()` in SSR hydration\n\n**Status: ✅ Already mitigated (AWD-M-328, resolved 2026-07-27):**\n- GHSA-wrjc-x8rr-h8h6: mitigated via `sanitizeRedirectPath` in `apps/frontend/src/utils/sanitizer.ts`; normalises backslashes, rejects `//`-prefixed paths; applied to all post-auth redirects in `LoginPage.tsx`\n- GHSA-337j-9hxr-rhxg: confirmed N/A — Awade is a CSR app, SSR hydration path is never executed\n\n`npm audit` will continue flagging until a patched react-router version is released. No new action needed.\n\n### Backend (`pip list --outdated` / `requirements.txt` review)\n\n**Result: ✅ Clean.** No code commits since yesterday's clean check. All project deps in `apps/backend/requirements.txt` remain at current security-patched versions. `pip list --outdated` output reflects system Anaconda env, not the deployed `requirements.txt`.\n\n---\n\n## 4. OWASP Web Top 10\n\nNo code changes in today's commits (heartbeat/sync only). All findings from yesterday's full pass carry forward.\n\n### A01 — Broken Access Control\n\nAll 11 router files reviewed:\n\n| Router | Protection |\n|--------|-----------|\n| `auth.py` | Public routes intentionally unauthenticated; `/me` uses `Depends(get_current_user)` ✅ |\n| `children.py` | All 13 routes use `Depends(require_parent)` + per-route `@limiter.limit()` ✅ |\n| `lesson_plans.py` | All routes use `Depends(require_educator)` or `Depends(require_admin_or_educator)` ✅ |\n| `admin.py` | Router-level `dependencies=[Depends(require_admin)]`; role-change ops restricted to `SUPER_ADMIN` ✅ |\n| `curriculum.py` | Reads: `get_current_active_user`; mutations: `require_admin` ✅ |\n| `curriculum_structure.py` | Same pattern ✅ |\n| `country.py` | GET: `get_current_active_user`; mutations: `require_admin` ✅ |\n| `grade_level.py` | Same pattern as `country.py` ✅ |\n| `subject.py` | Same pattern as `country.py` ✅ |\n| `users.py` | Self-service: `get_current_active_user`; admin ops: `require_admin`/`require_admin_or_educator` ✅ |\n| `contexts.py` | All routes: `Depends(require_admin_or_educator)` ✅ |\n\n**Result: ✅ Pass.** EDUCATOR / PARENT / ADMIN / SUPER_ADMIN role enforcement correctly applied across all routers.\n\n### A02 — Cryptographic Failures\n- JWT signed with `SECRET_KEY` (PyJWT 2.13.0, HS256) — env-only, never hardcoded ✅\n- Passwords hashed with bcrypt ✅\n- Auth tokens in HttpOnly cookies (access 30 min, refresh 7 days) ✅\n- `secure=IS_PRODUCTION` on cookies ✅\n- `send_default_pii=False` in Sentry init (COPPA/GDPR) ✅\n\n### A03 — Injection\n- No f-string SQL queries — all ORM or parameterized `text()` ✅\n- Pydantic validates all request bodies ✅\n- Rate limits on all public-facing endpoints ✅\n\n### A04 — Insecure Design\n- Account enumeration guard active in `auth_service.py:230–236` (AWD-M-307, AWD-H-133) ✅\n- Generic error responses on registration and login — no email-existence leakage ✅\n\n### A05 — Security Misconfiguration\n- CORS: non-wildcard in production via `ALLOWED_ORIGINS` env var; localhost-only fallback in dev ✅\n- `TrustedHostMiddleware` enforced in non-dev/test environments ✅\n- Security headers (`X-Content-Type-Options`, `X-Frame-Options`, `HSTS`, `Referrer-Policy`, `CSP`) on all API responses ✅\n- Vercel frontend headers (`vercel.json`) include `X-Frame-Options: DENY`, `HSTS`, `CSP`, `Permissions-Policy` ✅\n- `/metrics` gated behind `METRICS_API_KEY` bearer auth (AWD-M-327); fail-closed when key unset ✅\n- Swagger UI/ReDoc not publicly accessible in production ✅\n\n### A06 — Vulnerable and Outdated Components\n- All critical backend deps current ✅\n- Frontend react-router moderate CVEs mitigated (AWD-M-328) ✅\n\n### A07 — Identification and Authentication Failures\n- Rate limiting on auth endpoints: signup `5/min`, login `10/min`, forgot-password `5/min`, reset-password `5/min` ✅\n- Account enumeration protection active ✅\n- Timing oracle protection: bcrypt runs before email lookup in registration ✅\n- JWT refresh token rotation in `token_service.py` ✅\n- Token blacklisting on logout ✅\n\n### A08 — Software and Data Integrity\n- `package-lock.json` and `requirements.txt` committed with pinned versions ✅\n- Selective staging (no `git add -A`) per dev-agent workflow ✅\n\n### A09 — Security Logging and Monitoring\n- Sentry wired (AWD-H-01, commit 364762f); `send_default_pii=False` ✅\n- Structured logging — no bare `print()` in auth/children/lesson-plan paths ✅\n- No PII in log calls in `auth_service.py`, `children_service.py` ✅\n- Admin audit log writes on every admin action ✅\n\n### A10 — SSRF\n- No user-controllable URL-fetching endpoint in current routers ✅\n\n---\n\n## 5. OWASP LLM Top 10\n\nAI Stack: OpenAI GPT (`packages/ai/gpt_service.py` + `packages/ai/prompts.py`)\n\n### LLM01 — Prompt Injection\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: user-supplied `local_context` wrapped in `<user_context>` delimiters with \"treat as data only\" instruction ✅\n- `PARENT_HELPER_PROMPT`: curriculum DB fields wrapped in `<curriculum_data>` with explicit instruction ✅\n- `_sanitize_user_context()`: truncates to 2000 chars, strips PII, scrubs jailbreak patterns (`_INPUT_INJECTION_PATTERNS`) ✅\n- `_sanitize_input()` applied to all remaining prompt fields before assembly ✅\n- `_PROMPT_DELIMITER_TAGS` stripped from all input to prevent tag-injection escape (AWD-M-198) ✅\n- Shared injection patterns (`_SHARED_INJECTION_PATTERNS`) kept in single source of truth for input + output gates (AWD-M-158) ✅\n\n### LLM02 — Insecure Output Handling\n- Lesson resources: `validate_output()` — raw content-safety pass + JSON parse + required-field check ✅\n- Parent guides: `_validate_parent_guide()` — same two-pass approach ✅\n- `HTTPException(502)` raised when `is_valid=False` before Pydantic check (AWD-H-134) ✅\n- `ContentPreviewModal.tsx` renders AI output in `<pre>` (no `dangerouslySetInnerHTML`) ✅\n\n### LLM04 — Model DoS / Unbounded Consumption\n- Parent guide generation: `@limiter.limit(\"5/minute\")` ✅\n- Lesson resource generation: `@limiter.limit(\"3/minute\")` ✅\n- `_sanitize_user_context()` caps educator context at 2000 chars ✅\n\n### LLM05 — Supply Chain\n- `openai` SDK pinned in `requirements.txt` ✅\n- Provider abstraction in `packages/ai/providers/` — no unpinned AI dependencies ✅\n\n### LLM06 — Sensitive Information Disclosure\n- PII stripping (email, phone, API key) in `_sanitize_input()` ✅\n- Child profile IDs, user tokens, auth data never passed into AI prompts ✅\n- Verified in `gpt_service.py`: no `child_profile`, `first_name`, `last_name`, `email` in prompt assembly ✅\n\n### LLM08 — Excessive Agency\n- AI output validated and parsed before any persistence ✅\n- AI-generated content flagged in `GuideViewPage.tsx:255–273` and `EditLessonResourcePage.tsx:602–610` ✅\n- No silent write-back of unvalidated AI output ✅\n\n---\n\n## 6. New Backlog Items Filed\n\n**None.** No code changes since yesterday's clean report. No new vulnerabilities detected.\n\n---\n\n## 7. Open Items Tracking\n\n| ID | Area | Status |\n|----|------|--------|\n| H-73 | Security / Secrets — AI key rotation date unknown | `define` — unchanged |\n| H-79 | Tooling / QA — pytest venv setup in QA sandbox | `discover` — unchanged |\n| C-13 | Git / Tooling — recurring staged-index reversion | `define` — unchanged; requires Tolu to identify the tool |\n\n---\n\n## Summary\n\n**All CI security checks pass. No new vulnerabilities detected. No new backlog items required.**\n\nAuth, access control, CORS, token storage, prompt injection defences, AI output validation, and dependency security all remain in good shape. The react-router moderate CVEs continue to appear in `npm audit` but remain mitigated (AWD-M-328). Backend requirements.txt is clean. No code commits since yesterday's clean run — heartbeat/sync commits only.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-08-02.md", "path": "../agentic/audits/security-report-2026-08-02.md", "category": "Security audit", "agent": "security-agent", "date": "2026-08-02", "content": "# Security Report — 2026-08-02\n\n**Agent:** security-agent (scheduled, 6am run)\n**Date:** 2026-08-02\n**Status: ✅ CLEAN — No new findings. All CI checks pass.**\n\n---\n\n## 1. CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| Sensitive files in git (`*.env`, `*.key`, `*.pem`, `*.p12`) | ✅ PASS — none found |\n| `docs/private/` in git | ✅ PASS — none found |\n| `.env.example` present | ✅ PASS |\n| `.cursor/mcp.json` valid JSON | ✅ PASS |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS |\n\n---\n\n## 2. Secret Scan\n\nScanned `apps/`, `packages/` for `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`.\n\n**Result: ✅ Clean.** All matches are safe `os.getenv(...)` patterns:\n- `apps/backend/init_db.py` — `os.getenv(\"ADMIN_PASSWORD\")`, `os.getenv(\"EDUCATOR_PASSWORD\")` ✅\n- `apps/backend/redis_client.py` — `password=REDIS_PASSWORD` (variable, not literal) ✅\n- `apps/backend/main.py:183` — `os.getenv(\"METRICS_API_KEY\", \"\")` ✅\n- `apps/backend/tests/conftest.py:297` — `api_key=\"test\"` (test fixture only, never reaches production) ✅\n- `packages/ai/providers/openai_provider.py` — `os.getenv(\"OPENAI_API_KEY\")` ✅\n- `packages/ai/providers/gemini_provider.py` — `os.getenv(\"GEMINI_API_KEY\")` ✅\n\nNo hardcoded secrets.\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (`npm audit --production`)\n\n`react-router` and `react-router-dom` 6.30.4 still appear with 2 moderate CVEs:\n- **GHSA-wrjc-x8rr-h8h6** — Open redirect via backslash in `<Link>` / `useNavigate`\n- **GHSA-337j-9hxr-rhxg** — Arbitrary Constructor Injection via `deserializeErrors()` in SSR hydration\n\n**Status: ✅ Already mitigated (AWD-M-328, resolved 2026-07-27):**\n- GHSA-wrjc-x8rr-h8h6 mitigated via `sanitizeRedirectPath` in `apps/frontend/src/utils/sanitizer.ts`, normalises backslashes and rejects `//`-prefixed paths; applied to all post-auth redirect paths in `LoginPage.tsx`\n- GHSA-337j-9hxr-rhxg confirmed N/A — Awade is a CSR app, the SSR hydration path is never executed\n\n`npm audit` will continue to flag these until a patched react-router version is released. No new action needed.\n\n### Backend (`pip list --outdated` / requirements.txt review)\n\n**Result: ✅ Clean.** All project dependencies in `apps/backend/requirements.txt` are at current security-patched versions:\n- `cryptography==48.0.1` ✅ (all Pillow/OpenSSL CVEs resolved — AWD-H-95, M-301)\n- `Pillow==12.3.0` ✅ (13 PYSEC-2026 CVEs cleared — AWD-H-138)\n- `starlette==1.3.1` ✅ (PYSEC-2026-161 Host header injection — AWD-H-126)\n- `fastapi==0.137.1` ✅ (enables starlette>=1.0.1 compatibility)\n- `PyJWT==2.13.0` ✅ (PYSEC-2026-175/177/178/179 — AWD-M-207)\n- `urllib3==2.7.0` ✅ (PYSEC-2026-141/142 — AWD-M-199)\n- `python-multipart==0.0.31` ✅ (multipart DoS CVEs — AWD-H-76, M-300)\n- `setuptools==83.0.0` ✅ (CVE-2025-47273 etc. — AWD-M-329)\n- `httplib2==0.32.0` ✅ (PYSEC-2026-3444 — AWD-M-330)\n- `requests==2.33.0` ✅ (AWD-M-114)\n\n`pip list --outdated` in the system Python shows many packages, but those are the system Anaconda environment — not the project's deployed `requirements.txt` which is what matters for Render.\n\n---\n\n## 4. OWASP Web Top 10\n\n### A01 — Broken Access Control\n\nReviewed all router files in `apps/backend/routers/`:\n\n| Router | Protection |\n|--------|-----------|\n| `auth.py` | Public routes (signup/login/google/refresh/forgot-password/reset-password) intentionally unauthenticated; `/me` uses `Depends(get_current_user)` ✅ |\n| `children.py` | All 13 routes use `Depends(require_parent)` ✅ |\n| `lesson_plans.py` | All routes use `Depends(require_educator)` or `Depends(require_admin_or_educator)` ✅ |\n| `admin.py` | Router-level `dependencies=[Depends(require_admin)]` ✅; role-change ops restricted to `SUPER_ADMIN` ✅ |\n| `curriculum.py` | `Depends(get_current_active_user)` on all routes; mutations require `require_admin` ✅ |\n| `curriculum_structure.py` | Same pattern — reads require `get_current_active_user`, writes require admin ✅ |\n| `country.py` | GET: `get_current_active_user`; mutations: `require_admin` ✅ |\n| `grade_level.py` | Same pattern as `country.py` ✅ |\n| `subject.py` | Same pattern as `country.py` ✅ |\n| `users.py` | All routes protected — self-service uses `get_current_active_user`, admin ops use `require_admin`/`require_admin_or_educator` ✅ |\n| `contexts.py` | All routes use `Depends(require_admin_or_educator)` ✅ |\n\n**Result: ✅ Pass.** Role enforcement (EDUCATOR / PARENT / ADMIN / SUPER_ADMIN) correctly applied across all routers.\n\n### A02 — Cryptographic Failures\n- JWT signed with `SECRET_KEY` (PyJWT 2.13.0, HS256) — env-only, never hardcoded ✅\n- `dependencies.py` guards against default weak `SECRET_KEY` in non-safe environments ✅\n- Passwords hashed with bcrypt (`gensalt()` + `hashpw()`) in `auth_service.py:75–76` ✅\n- Auth tokens stored in **HttpOnly cookies** (access 30 min, refresh 7 days) — confirmed in `auth.py:50–67`, `AuthContext.tsx` ✅\n- No tokens in `localStorage` ✅\n- `secure=IS_PRODUCTION` on cookies — production-only HTTPS flag ✅\n- `send_default_pii=False` in Sentry init (COPPA/GDPR) ✅\n\n### A03 — Injection\n- No f-string SQL queries in any router or service — all ORM or parameterized `text()` ✅\n- `migrate_database.py` uses `text(\"\"\"...\"\"\")` for schema introspection queries only (static strings, no user input) ✅\n- All request bodies validated by Pydantic schemas in `apps/backend/schemas/` ✅\n- Rate limits protect all public-facing endpoints\n\n### A04 — Insecure Design\n- Account enumeration guard verified active in `auth_service.py:230–236` — bcrypt always runs before email-existence check (AWD-M-307) ✅\n- Generic registration error response — no email-existence leakage (AWD-H-133) ✅\n\n### A05 — Security Misconfiguration\n- CORS: non-wildcard in production; allowlist driven by `ALLOWED_ORIGINS` env var ✅\n- `TrustedHostMiddleware` enforced in non-dev/test environments ✅\n- Security headers middleware (`security_headers.py`) adds `X-Content-Type-Options`, `X-Frame-Options`, `HSTS`, `Referrer-Policy`, `CSP` on all API responses ✅\n- Vercel frontend headers (`vercel.json`) set `X-Frame-Options: DENY`, `HSTS`, `CSP`, `Permissions-Policy` ✅\n- Metrics endpoint `/metrics` gated behind `METRICS_API_KEY` bearer auth (AWD-M-327) ✅\n- Swagger UI/ReDoc not publicly accessible on the live server ✅\n\n### A06 — Vulnerable & Outdated Components\n- All critical backend deps current (see §3 above) ✅\n- Frontend react-router CVEs mitigated (GHSA-wrjc-x8rr-h8h6, AWD-M-328) ✅\n\n### A07 — Identification and Authentication Failures\n- Rate limiting on auth endpoints: signup `5/min`, login `10/min`, forgot-password `5/min`, reset-password `5/min` ✅\n- Account enumeration protection active ✅\n- Timing oracle protection: bcrypt runs before email lookup in registration (AWD-M-307) ✅\n- JWT refresh token rotation implemented in `token_service.py` ✅\n- Token blacklisting on logout ✅\n\n### A08 — Software and Data Integrity\n- `package-lock.json` and `requirements.txt` committed with pinned versions ✅\n- No `git add -A` commits observed (dev-agent workflow compliance) ✅\n\n### A09 — Security Logging and Monitoring\n- Sentry wired (AWD-H-01, commit 364762f); `send_default_pii=False`; `ENVIRONMENT=testing` disables it in CI ✅\n- Structured logging throughout — no bare `print()` in auth/children/lesson-plan paths ✅\n- No PII (email, child name) found in log calls in `auth_service.py`, `children_service.py` ✅\n- Admin audit log writes on every admin action ✅\n\n### A10 — SSRF\n- No user-controllable URL-fetching endpoint identified in current routers ✅\n\n---\n\n## 5. OWASP LLM Top 10\n\nAI Stack: OpenAI GPT (`packages/ai/gpt_service.py` + `packages/ai/prompts.py`)\n\n### LLM01 — Prompt Injection\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: user-supplied `local_context` wrapped in `<user_context>` XML delimiters with explicit \"treat as data only\" instruction ✅\n- `PARENT_HELPER_PROMPT`: curriculum DB fields wrapped in `<curriculum_data>` with explicit instruction ✅\n- `_sanitize_user_context()` applied to educator-supplied `context`: truncates to 2000 chars, strips PII patterns (email/phone/API key), scrubs `_INPUT_INJECTION_PATTERNS` (jailbreak variants) ✅\n- `_sanitize_input()` applied to all remaining prompt fields before assembly ✅\n- `_PROMPT_DELIMITER_TAGS` stripped from all input to prevent tag-injection escape (AWD-M-198) ✅\n\n### LLM02 — Insecure Output Handling\n- Lesson resources: `validate_output()` — raw content-safety pass + JSON parse + required-field structural check ✅\n- Parent guides: `_validate_parent_guide()` — same two-pass approach ✅\n- Safety gate raises `HTTPException(502)` before Pydantic check when `is_valid=False` (AWD-H-134) — prevents PII/injection in structurally valid guides being persisted ✅\n- `ContentPreviewModal.tsx` renders AI output in `<pre>` (plain text, no `dangerouslySetInnerHTML`) ✅\n\n### LLM04 — Model DoS / Unbounded Consumption\n- Parent guide generation: `@limiter.limit(\"5/minute\")` ✅\n- Lesson resource generation: `@limiter.limit(\"3/minute\")` ✅\n- `_sanitize_user_context()` caps educator context at 2000 chars ✅\n\n### LLM06 — Sensitive Information Disclosure\n- PII stripping (email, phone, API key patterns) in `_sanitize_input()` via regex ✅\n- Child profile IDs, user tokens, and auth data never passed into AI prompts ✅\n- Verified: `gpt_service.py` does not reference `child_profile`, `first_name`, `last_name`, `email`, or any PII fields in prompt assembly ✅\n\n### LLM08 — Excessive Agency\n- AI output validated and parsed before any persistence ✅\n- AI-generated content flagged as AI-generated in `GuideViewPage.tsx:255–273` and `EditLessonResourcePage.tsx:602–610` ✅\n- No silent write-back of unvalidated AI output ✅\n\n### LLM05 — Supply Chain\n- `openai` SDK pinned in `requirements.txt` ✅\n- Provider abstraction in `packages/ai/providers/` — no new unpinned AI dependencies ✅\n\n---\n\n## 6. New Backlog Items Filed\n\n**None.** All previously identified issues remain resolved or in-progress. No new vulnerabilities detected in this run.\n\n---\n\n## 7. Open Items Tracking\n\n| ID | Area | Status |\n|----|------|--------|\n| H-73 | Security / Secrets — AI key rotation date unknown | `define` — unchanged |\n| H-79 | Tooling / QA — pytest venv setup in QA sandbox | `discover` — unchanged |\n| C-13 | Git / Tooling — recurring staged-index reversion | `define` — unchanged; requires Tolu to identify the tool |\n\n---\n\n## Summary\n\n**All CI security checks pass. No new vulnerabilities detected. No new backlog items required.**\n\nAuth, access control, CORS, token storage, prompt injection defences, AI output validation, and dependency security are all in good shape. The react-router moderate CVEs continue to appear in `npm audit` but are mitigated (AWD-M-328). Backend pip-audit is clean against `requirements.txt`.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-07-30.md", "path": "../agentic/audits/security-report-2026-07-30.md", "category": "Security audit", "agent": "security-agent", "date": "2026-07-30", "content": "# Security Report — 2026-07-30\n\n**Agent:** security-agent (s ntentPreviewModal.tsx` uses `<pre>` (plain text), not `dangerouslySetInnerHTML`\n- AI outputs validated before persisting to DB\n\n### LLM04 — Model DoS ✅\n\n- Parent guide generation: `@limiter.limit(\"5/minute\")`\n- Lesson plan generation: `@limiter.limit(\"5/minute\")`\n- Lesson resource generation: `@limiter.limit(\"3/minute\")`\n\n### LLM06 — Sensitive Information Disclosure ✅\n\n- No child names, emails, or user tokens passed into prompt templates\n- PII stripping in `_sanitize_input()` covers email patterns (regex) and phone numbers\n\n### LLM08 — Excessive Agency ✅\n\n- AI outputs reviewed and validated before any side effects (guide saved to DB after JSON parse + field check)\n- AI disclosure banners present on `GuideViewPage.tsx` and `EditLessonResourcePage.tsx` (AWD-M-196 verified)\n\n---\n\n## New Finding Filed\n\n### AWD-H-139 — Pillow 12.2.0 in local venv (12.3.0 required by requirements.txt)\n\n`requirements.txt` pins `Pillow==12.3.0` (fixed by AWD-H-138, 2026-07-27), but the local venv still has `12.2.0`. The venv was not refreshed after the requirements.txt bump.\n\n**Impact:** Local development environment runs Pillow with 13 patched CVEs (PYSEC-2026-2253/2254/2255/2256/2257 + PYSEC-2026-3451/3452/3453/3454/3493/3494/3495/3496). Production (Render) deploys from `requirements.txt` directly and is not affected.\n\n**Fix:** `venv/bin/pip install -r apps/backend/requirements.txt` (same remedy as AWD-H-136 + AWD-H-137).\n\nFiled in backlog as **H-139** (same pattern and severity as H-136/H-137).\n\n---\n\n## Open Security Items (from backlog)\n\n| ID | Issue | Status |\n|----|-------|--------|\n| H-79 | Set up venv + pytest in QA sandbox | discover |\n| H-73 | AI API key rotation date unknown | define |\n| M-327 | Prometheus /metrics endpoint unauthenticated | marked done — code fix verified |\n| M-305 | `sync.sh` cannot push to origin (permission) | define — requires Tolu decision |\n\n---\n\n## Summary\n\nAll 5 CI security checks pass. No hardcoded secrets found. Auth and access control are sound across all routers — every endpoint has the correct dependency applied. OWASP LLM defences (prompt delimiters, output validation, rate limits) are robust.\n\n**One new finding filed:** AWD-H-139 — local venv has Pillow 12.2.0 while requirements.txt pins 12.3.0. Production is not affected. Dev-agent should run `venv/bin/pip install -r apps/backend/requirements.txt` to sync.\n\nThe react-router npm audit flag (GHSA-wrjc-x8rr-h8h6, GHSA-337j-9hxr-rhxg) persists but both CVEs are mitigated at code level by AWD-M-328 — no new action required today.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-07-28.md", "path": "../agentic/audits/security-report-2026-07-28.md", "category": "Security audit", "agent": "security-agent", "date": "2026-07-28", "content": "# Security Report — 2026-07-28\n\n**Agent:** security-agent  \n**Run time:** 2026-07-28 06:09 UTC  \n**Branch:** develop  \n**Status:** ✅ No new issues — all CI security checks pass\n\n---\n\n## 1. CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| No `*.env / *.key / *.pem / *.p12` in git | ✅ PASS |\n| No `docs/private/` in git | ✅ PASS |\n| `.env.example` exists | ✅ PASS |\n| `.cursor/mcp.json` valid JSON | ✅ PASS |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS |\n\n---\n\n## 2. Secret Scan\n\nScanned `apps/` and `packages/` for `sk_live`, `sk_test`, `AIza`, `password =`, `api_key =`.\n\n**Result: No hardcoded secrets found.**\n\nAll matched lines use `os.getenv()` or are test fixtures with explicit mock values (`api_key=\"test\"` in `conftest.py`). The `password=REDIS_PASSWORD` match in `redis_client.py:17` references an env var variable, not a literal.\n\n---\n\n## 3. Dependency Audit\n\n### Frontend (npm audit --production)\n```\n2 moderate severity vulnerabilities\nreact-router  6.0.0 - 7.17.0\n  - GHSA-wrjc-x8rr-h8h6 (Open redirect via backslash)\n  - GHSA-337j-9hxr-rhxg (Constructor injection via SSR hydration)\n```\n\n**Assessment:** Both CVEs are **tracked and mitigated** (AWD-M-328, resolved 2026-07-27):\n- GHSA-wrjc-x8rr-h8h6: `sanitizeRedirectPath` applied at the `LoginPage.tsx` redirect entry point.\n- GHSA-337j-9hxr-rhxg: Confirmed N/A — Awade is a CSR application; SSR hydration path does not exist.\n- Current version: `^6.8.1` (package.json). A future v6/v7 patch upgrade would eliminate the npm audit warning — track as low-priority upgrade.\n\n**No new actions required.** Known and mitigated.\n\n### Backend (safety check on requirements.txt)\n```\n0 vulnerabilities reported\n```\nAll packages in `apps/backend/requirements.txt` are clean against the safety open-source database as of 2026-07-28. Recent security bumps (Pillow 12.3.0, setuptools 83.0.0, httplib2 0.32.0 — AWD-H-138/M-329/M-330, commit f9260e9) remain current.\n\n---\n\n## 4. OWASP Web Top 10\n\n### A01 — Broken Access Control\n- Every router uses `Depends(get_current_active_user)`, `require_parent`, `require_educator`, or `require_admin` on all non-public endpoints. Verified across all 13 routers.\n- Admin router applies `Depends(require_admin)` at the router level (`router = APIRouter(..., dependencies=[Depends(require_admin)])`).\n- `require_parent` and `require_educator` enforce role isolation — cross-role access returns 403.\n- ✅ No unauthenticated access to protected resources.\n\n### A02 — Cryptographic Failures\n- Passwords hashed with bcrypt.\n- JWT access tokens signed with `SECRET_KEY` (env var). Refresh tokens stored in HttpOnly cookies.\n- Access tokens served via HttpOnly cookies (verified in `AuthContext.tsx` comment: \"access_token is an HttpOnly cookie — no localStorage check needed\").\n- No localStorage usage for auth state.\n- ✅ No cryptographic issues identified.\n\n### A03 — Injection\n- All DB queries use SQLAlchemy ORM.\n- No f-string SQL interpolation found in services (grep confirmed).\n- Request bodies typed with Pydantic schemas.\n- AI prompt inputs sanitized via `_sanitize_input()` before injection into templates.\n- ✅ No injection vectors found.\n\n### A05 — Security Misconfiguration\n- CORS: When `ALLOWED_ORIGINS` env var is not set or set to `*`, the backend falls back to localhost origins only (not `*`) — correct behavior. Production must set `ALLOWED_ORIGINS` to the Vercel domain.\n- `/metrics` endpoint gated behind `METRICS_API_KEY` bearer auth with `secrets.compare_digest` (constant-time comparison) — AWD-M-327.\n- Rate limiting applied globally via slowapi; AI endpoints limited to 5/minute.\n- ✅ No misconfigurations identified.\n\n### A07 — Identification and Authentication Failures\n- Login/signup endpoints rate-limited (10/minute login, 5/minute signup).\n- Account enumeration protection in place (AWD-H-133, resolved 2026-06-28).\n- Timing oracle closed (AWD-M-307, resolved 2026-06-28).\n- Google OAuth via server-side token verification.\n- ✅ No auth failures identified.\n\n### A09 — Security Logging and Monitoring\n- Structured logger used throughout (`logging.getLogger(__name__)`).\n- Sentry wired (AWD-H-01, commit 364762f) — set `SENTRY_DSN` env var to activate.\n- Audit middleware records authenticated user_id (AWD-M-197, resolved 2026-06-24).\n- AI injection detections logged at WARNING level.\n- No `print()` / `console.log()` in production paths (websocket.ts logs behind `import.meta.env.DEV` guard).\n- ✅ Logging posture is strong.\n\n---\n\n## 5. OWASP LLM Top 10\n\n### LLM01 — Prompt Injection\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: user-supplied `local_context` wrapped in `<user_context>…<\/user_context>` delimiters with explicit instruction to treat as data only.\n- `PARENT_HELPER_PROMPT`: curriculum DB data wrapped in `<curriculum_data>…<\/curriculum_data>` delimiters. No free-form user text injected — all values come from controlled DB fields.\n- `_sanitize_input()`: strips delimiter tags (case-insensitive since AWD-M-266), truncates at 2000 chars, strips delimiter tags via `re.sub(flags=re.IGNORECASE)`.\n- `_sanitize_user_context()`: detects 6+ jailbreak patterns (DAN, pretend-unrestricted, developer-mode, etc.) and scrubs.\n- `_SHARED_INJECTION_PATTERNS` shared between input and output gate (AWD-M-158) — prevents drift.\n- ✅ Prompt injection defences are layered and comprehensive.\n\n### LLM02 — Sensitive Information Disclosure\n- `validate_output()` scans AI output for email addresses, phone numbers, and API keys before use.\n- No child profile IDs, child names, or parent emails flow into AI prompt templates (verified in `_build_guide_ai_payload`).\n- Output gate also checks for injection-success markers before persisting.\n- ✅ No sensitive disclosure risk found.\n\n### LLM04 — Model DoS (Unbounded Consumption)\n- Guide generation: `@limiter.limit(\"5/minute\")` on `/children/{child_id}/guides/generate`.\n- Export endpoint: `@limiter.limit(\"5/minute\")` on `/guides/{guide_id}/export`.\n- Lesson resource generation: `@limiter.limit(\"5/minute\")`.\n- `AI_MAX_TOKENS` capped via env var (default 8192).\n- ✅ Rate limits in place on all AI endpoints.\n\n### LLM08 — Excessive Agency\n- AI output validated against Pydantic schema (`ParentGuideAIContent.model_validate_json`) before persistence (AWD-H-06).\n- `validate_output()` must pass before any side effect (store, serve).\n- Failed safety/structural validation returns HTTP 502 — no partial writes.\n- ✅ AI output gated before side effects.\n\n### LLM05 — Supply Chain\n- OpenAI SDK pinned in `requirements.txt`.\n- Gemini SDK pinned. Safety check: 0 known CVEs in backend deps.\n- ✅ Supply chain is clean.\n\n### No issues: LLM03 (no fine-tuning), LLM06 (no raw user input in system prompts), LLM07 (no plugins), LLM10 (no model exposure).\n\n---\n\n## 6. COPPA / GDPR Compliance Check\n\n- GDPR data export (`GET /api/users/me/data-export`, GRC-02): implemented, auth-gated, rate-limited.\n- GDPR account deletion (`DELETE /api/users/me`, GRC-03): implemented, cascades to child profiles and guides.\n- COPPA: parental consent gate (`POST /api/parent/consent`) required before child profile creation. `parental_consents` table tracks consent records.\n- No child PII (name, grade, country) logged or passed to AI prompts — only curriculum data from DB.\n- ✅ COPPA/GDPR posture is strong.\n\n---\n\n## 7. Summary\n\n**No new Critical or High issues found.**\n\n| Finding | Severity | Status |\n|---------|----------|--------|\n| react-router moderate CVEs (GHSA-wrjc-x8rr-h8h6, GHSA-337j-9hxr-rhxg) | Moderate | Mitigated (AWD-M-328 resolved 2026-07-27); npm audit still flags unupgraded package |\n| Backend dependency CVEs | None | safety check: 0 vulnerabilities |\n| Hardcoded secrets | None | Clean |\n| Access control gaps | None | All routes protected |\n| AI prompt injection | None | Layered defences in place |\n\n**All CI security job checks pass. Security posture remains strong after yesterday's Pillow/setuptools/httplib2 bumps and react-router open-redirect mitigation.**\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-27-f9260e9.md", "path": "../code-reviews/review-2026-07-27-f9260e9.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-27", "content": "# Code Review — 2026-07-27 · f9260e9\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 1 (requirements.txt — docs/agent-audit.log is infrastructure output, not application code)\n**Commits covered**: f9260e9\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — | `api_key or os.getenv(\"GEMINI_API_KEY\")` | Env-sourced ✅ |\n\n**Result: CLEAN** — No hardcoded secrets found.\n\n---\n\n## 3. Dependency Audit\n\n### Frontend — npm audit\n\n```\nnpm audit --production → 2 moderate vulnerabilities (react-router / react-router-dom)\n```\n\n| Package | Version | CVE | Severity | Fix |\n|---------|---------|-----|----------|-----|\n| `react-router` | 6.30.4 | GHSA-wrjc-x8rr-h8h6 (open redirect via backslash in `<Link>`/`useNavigate`) | Moderate | 7.18.0+ |\n| `react-router` | 6.30.4 | GHSA-337j-9hxr-rhxg (arbitrary constructor injection via `deserializeErrors()` in SSR) | Moderate | 7.18.0+ (N/A — Awade is CSR) |\n\n**Filed as M-328.** The SSR injection (GHSA-337j-9hxr-rhxg) is not applicable — Awade uses client-side rendering with no `deserializeErrors()` call path. The open-redirect (GHSA-wrjc-x8rr-h8h6) is relevant but requires attacker-controlled redirect paths. Fix requires a breaking major upgrade v6 → v7; evaluate migration timeline.\n\n### Backend — pip-audit on requirements.txt\n\n```\npip-audit --requirement apps/backend/requirements.txt\n```\n\n| Package | Pinned | CVE | Fix Version | Filed |\n|---------|--------|-----|-------------|-------|\n| `Pillow` | 12.2.0 | PYSEC-2026-2253/2254/2255/2256/2257 + PYSEC-2026-3451/3452/3453/3454/3493/3494/3495/3496 (13 CVEs) | 12.3.0 | **H-138** |\n| `setuptools` | 78.1.1 | PYSEC-2026-3447 | 83.0.0 | **M-329** |\n| `httplib2` | 0.22.0 | PYSEC-2026-3444 | 0.32.0 | **M-330** |\n\n**Pillow (H-138):** 13 new CVEs in the 12.2.x release — all fixed in 12.3.0. Pillow is a production dependency used in `pdf_service.py` (WeasyPrint/PDF export path) and image upload processing. The 12.2 → 12.3 bump is a patch release; API compat should be maintained (Image.open/convert/thumbnail/save/Resampling.LANCZOS unchanged). This is the highest-priority fix.\n\n**setuptools (M-329):** Build-tooling dependency. PYSEC-2026-3447 is a new advisory published since last scan. Fixed at 83.0.0.\n\n**httplib2 (M-3
