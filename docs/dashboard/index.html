oads/` directory created at startup for static file serving — no path traversal risk (uses Starlette `StaticFiles`)\n\n### 6. Vulnerable and Outdated Components ⚠️\nLocal dev venv stale — see §3. Production safe. H-136 (starlette) and H-137 (cryptography + python-multipart) filed.\n\n### 7. Identification and Authentication Failures ✅\n- Account enumeration guard in place (generic error on failed signup — AWD-H-133 resolved)\n- Login rate-limited `10/minute`; signup `5/minute`; password reset `5/minute`\n- Suspended-user check enforced in `get_current_active_user`\n\n### 8. Software and Data Integrity ✅\n- `package-lock.json` committed (frontend)\n- `requirements.txt` pinned with exact versions + CVE comments\n\n### 9. Logging and Monitoring ✅\n- Structured logger (`logging`) used throughout — no bare `print()` in production request paths\n- 5 `console.log` calls in frontend are all gated `if (import.meta.env.DEV)` — not emitted in production\n- `child_id` logged in errors (no child name or PII) ✅\n- Sentry wired (AWD-H-01)\n- `AuditMiddleware` records `user_id` after auth (`request.state.user_id` — AWD-M-197)\n\n### 10. SSRF — N/A (no external URL fetch endpoints)\n\n---\n\n## 5. OWASP LLM Top 10\n\n### LLM01 — Prompt Injection ✅\n`packages/ai/prompts.py` uses delimiter tags:\n- Educator-supplied context: `<user_context>...<\/user_context>` — noted in system prompt as data-only\n- Curriculum DB data: `<curriculum_data>...<\/curriculum_data>` — noted in system prompt as data-only\n\n`gpt_service.py` applies three-layer defence in `_sanitize_user_context()`:\n1. **Truncation** to 2000 chars (token-stuffing prevention)\n2. **PII stripping** (API keys, email, phone)\n3. **Injection pattern scrubbing** — 17 patterns covering known jailbreaks; delimiter tags stripped by `_sanitize_input()` to prevent fake closing-tag escape attacks (AWD-M-198, AWD-M-266)\n\n### LLM02 — Insecure Output Handling ✅\n`validate_output()` / `_check_content_safety()` run on every AI response:\n- PII leakage (email, phone, API key patterns)\n- Injection markers (17 shared patterns — AWD-M-158)\n- Harmful content (adult/self-harm terms inappropriate for child-facing content)\n- JSON parse + required-field validation\n\nSafety gate raises `HTTPException(502)` before Pydantic check if `is_valid=False` (AWD-H-134 fix) — no unsafe content can be persisted.\n\n### LLM03 — Training Data Poisoning — N/A (no fine-tuning)\n\n### LLM04 — Model DoS ✅\nAI generation endpoints rate-limited:\n- `POST /children/{id}/guides/generate` → `5/minute`\n- `POST /guides/{id}/export` → `5/minute`\n- `POST /lesson_plans/generate` → `5/minute`\n- `POST /lesson_plans/{id}/resources/generate` → `3/minute`\n\n`AI_MAX_TOKENS` capped via env var (default 8192).\n\n### LLM05 — Supply Chain ✅\n`openai==1.109.1` pinned in `requirements.txt` — latest 1.x security patch. Intentionally staying below 2.x (breaking API; AWD-M-39 note in requirements.txt).\n\n### LLM06 — Sensitive Information Disclosure ✅\n- Child profile IDs, names, and tokens are not passed into prompts\n- Curriculum data passed as structured variables, not raw user text\n- `_sanitize_input()` strips PII before prompt assembly\n\n### LLM07 — Insecure Plugin Design — N/A (no plugins)\n\n### LLM08 — Excessive Agency ✅\nAI output is validated then stored — no side effects triggered directly from raw output. Parent-facing guides displayed with \"AI-generated\" disclosure (per design spec).\n\n### LLM09 — Overreliance — Informational\nGuides are displayed with AI-generated indicator. No automated enforcement (by design).\n\n### LLM10 — Model Theft — N/A\n\n---\n\n## 6. Open Security Items (backlog)\n\n| ID | Issue | Stage |\n|----|-------|-------|\n| H-137 | Local dev venv: `cryptography 46.0.6` (PYSEC-2026-36) + `python-multipart 0.0.27` (CVE-2026-53538/39/40) | discover |\n| H-136 | Local dev venv: `starlette 0.46.2` (PYSEC-2026-161) | discover |\n| H-73 | AI API key rotation date unknown | define |\n| H-79 | Set up venv + pytest in QA sandbox | discover |\n\n---\n\n## 7. Conclusion\n\nSecurity posture is strong. No Critical or new High findings from CI, secret scan, auth audit, or LLM review. The one new filing (H-137) is local-dev-only with production safe. The recurring root cause — local venv not refreshed after `requirements.txt` security bumps — remains outstanding (H-136 + H-137). Fix is a single command: `venv/bin/pip install -r apps/backend/requirements.txt`.\n\n---\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "sprint-2026-07-13.md", "path": "../agentic/sprint-plans/sprint-2026-07-13.md", "category": "Sprint plan", "agent": "sprint-planning", "date": "2026-07-13", "content": "# Sprint — Week of 2026-07-13\n\n## Velocity Last Week\n- Commits (7 days): 236 total — the overwhelming majority are `chore(sync)` heartbeat / idle-run churn; ~24 are real work commits.\n- Issues completed: **12** closed in `completed_backlog.md` (2026-07-06 → 07-13): M-206, M-122, M-319, M-320, M-321, M-323, L-86, M-324, M-325, M-326, L-87, M-322.\n- Mix: a clean **security + hygiene week**. Two OWASP A01 role-enforcement fixes (M-321 `require_educator` on lesson-plan reads/export; M-326 `get_current_active_user` on 21 reference-data GETs), two DepSec bumps (M-325 weasyprint CVE-2026-49452; M-322 redis 5.2.1→8.0.1), one regression-test hardening (M-323), a devDependency bump (L-86), build-debris cleanup (M-324), a false-positive closure (L-87), and — notably — **M-122 shipped** (SettingsPage.tsx split into tab components), which was the top pre-build nomination in last week's plan.\n- Velocity: healthy throughput (12 vs 26 the prior week), but as before **none of it came from a `ready` item** — the dev-agent continues to self-promote fully-specced `discover`/`define` items that need no Tolu decision, then build them.\n\n## ⚠️ The headline finding — unchanged for a third week\n\n1. **Origin push is still broken (M-305 — unresolved 3 weeks running).** `.agent-health/sync-failures.log` shows `PULL_FAILED` / `PULL_REBASE_FAILED` / `PUSH_DEFERRED` entries continuing through this morning (2026-07-13T08:10Z). Every \"done\" item this week still merged only to **local** `develop`; CI never ran and `main` was not promoted. Each closed issue is effectively un-shipped until Tolu pushes manually. **This is priority one and needs a Tolu decision** on a durable push mechanism (scoped PAT in the dev-agent env vs. CI-side trigger). Flagged as top priority in both prior sprint plans — no movement.\n2. **The `ready` queue is empty again.** Zero open issues sit at `stage=ready` and zero at `in-progress`. Every open issue is `define` (15) or `discover` (10). The dev-agent keeps building by self-promoting the well-specced ones — that works, but it means the stage gate is decorative and the true constraint is \"how many small, decision-free items remain,\" which is shrinking.\n\n## This Sprint's Issues (nominated — buildable now, no Tolu decision, ≤ M effort)\nThese are well-specced and self-contained. Each is currently `discover`/`define`; the pre-build step is to advance it to `ready` so the dev-agent picks it up cleanly under the stage gate (rather than self-promoting).\n\n| Priority | ID | Title | Area | Effort | Stage now |\n|----------|----|-------|------|--------|-----------|\n| High | M-327 | Add auth to unauthenticated Prometheus `/metrics` endpoint (`main.py:237`) — leaks route names/latency/error rates | Security / OWASP A05 | S | discover |\n| Medium | M-20 | Prompt-quality gate for parent \"How to Help\" guides — verify parent-friendly tone across topics/grades/subjects (accept. bar in rebranding §5.2) | AI / Quality (Parent flow) | M | discover |\n| Low | L-60 | Confirm 13 one-off `scripts/` debug scripts are dead (90d untouched) and `git rm` | Code / Hygiene | S | discover |\n\nBalance check (≤1 Parent + ≤1 Educator + infra/security + polish):\n- **Infra/Security** → M-327 (top pick — concrete, fully-specced, no decision needed)\n- **Parent flow** → M-20 (most overdue item on the board — a pre-launch must-do now 1 month post-launch, still unexecuted)\n- **Polish** → L-60\n- **Educator flow** → *none selected.* Every remaining educator-facing item is an effort-`L` file split (M-119 CurriculumManager, M-120 api.ts, M-121 EditLessonResourcePage) that exceeds the 2-day auto-execution limit until sliced. See Parked.\n\n## Stretch Goals (if the queue clears mid-sprint)\n- **L-61** (M) — extract shared `curriculum_io.py` from the three populate/export scripts. Self-contained, no decision.\n- **H-136** (XS) — refresh the local dev venv (`starlette` 0.46.2 → 1.3.1, PYSEC-2026-161). Production (Render) is already safe; this is a local-environment action, not a committable repo change — do it opportunistically, not as a build item.\n\n## Parked — Large Refactors (effort L, skipped per > 2d rule)\n`M-119` (CurriculumManager.tsx, 1051 lines), `M-120` (api.ts, 872), `M-121` (EditLessonResourcePage.tsx, 853), `M-123` (pdf_service.py, 835 — size only, tests now exist), `M-124` (gpt_service.py god object — needs ADR first), `M-125` (user_service.py, 644 — size only), `M-214` (children_service.py, 626 — extract ParentGuideService). All byte-identical for 6+ weeks. **None buildable until broken into sub-2-day slices.** Highest-leverage unblock: have architecture-agent write the M-124 ADR and re-verify whether the stale \"AWD-M-208 uncommitted WIP\" blocker on M-124/M-214 still holds (the NERDC importer appears shipped per the codebase map).\n\nSeparately, **M-216** (split models.py, 460 lines) still needs an architecture-agent ADR before it can advance — untouched for three weeks running.\n\n## Blocked / Needs Tolu's Input (cannot proceed without a decision)\n| ID | What's needed from Tolu |\n|----|--------------------------|\n| **M-305** | **Top priority — unresolved 3 weeks.** Decide the durable push mechanism (scoped PAT in dev-agent env, or CI-side trigger). Until then nothing merged locally reaches origin or CI. |\n| C-13 | Identify the tool polluting the git index (VS Code / GitLens / virtiofs); confirm the index is clean on your machine. |\n| M-17 | Pick one migration system (Alembic) — blocks M-16 (`child_profiles.subjects` → join table). |\n| M-269 | Product decision: SEO content surface (blog subdomain vs. prerendered routes) before GTM keyword clusters can be claimed. |\n| M-212 | Confirm the live production domain (`awade.app` vs `.io` vs `.com`) to align canonical/OG/JSON-LD/CTAs. |\n| M-318 | Decide: stand up a sandbox uvicorn for perf benchmarking, or drop the synthetic latency check in favour of Sentry real-user latency. |\n| M-67 | Decide the authoritative cache layer — document the in-process/Redis split or remove the in-process cache. |\n| M-204 | Approve the audit-log retention window (1 year) before the purge job is built (legal review). |\n| H-73 | Rotate AI provider keys (OPENAI/GEMINI/GOOGLE) in dashboards + Render — requires dashboard access agents don't have. |\n| L-07 | Confirm whether any pre-pivot educator clients still call `/auth/google` without a role. |\n| H-79 | QA sandbox: free disk space / set up venv+pytest — restart Claude desktop to refresh the container. |\n\n## Focus Statement\nWinning this sprint = **land M-327 (metrics-endpoint auth), execute the long-overdue M-20 parent-prompt quality gate, and get a durable answer to M-305 so shipped work actually reaches origin.** Throughput is fine; the real risk is that three weeks of \"done\" work sits un-pushed while the pool of decision-free build items quietly drains — the fix is a Tolu decision on push credentials, not more velocity.\n\n---\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: sprint-planning output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-13.md", "path": "../agentic/weekly-reviews/review-2026-07-13.md", "category": "Weekly review", "agent": "weekly-review", "date": "2026-07-13", "content": "# Awade Weekly Review — 2026-07-13 (Mon)\n\n**Agent:** awade-weekly-review · **Window:** 2026-07-06 → 2026-07-13\n**Project stage:** launched · **Revenue stage:** pre-revenue\n**North Star:** Weekly Active Learners (parents + teachers who generate/view a guide or lesson ≥1×/week)\n\n---\n\n## 1. Executive Summary\n\n- **Overall health: 🟡 Attention Needed** — engineering fleet is healthy and shipping clean, but two structural blockers persist and are now weeks old.\n- **Biggest win:** A clean run of security hardening merged to local `develop` — role-check enforcement (AWD-M-321, AWD-M-326), two CVE-driven dependency bumps (AWD-M-325 weasyprint, AWD-M-322 redis), and build-debris cleanup (AWD-M-324). ~12 backlog items closed in the window.\n- **Biggest risk:** **The git gateway is still broken (AWD-M-305).** `develop` is ahead of `origin` and `sync.sh push` continues to fail — a fresh `PULL_FAILED`/`PUSH_DEFERRED` cluster runs through 2026-07-13. GitHub CI has not validated a week-plus of commits; every \"done\" item is un-shipped until Tolu pushes manually. **Requires Tolu decision** on a durable push credential.\n- **Key number:** North Star = **unavailable** — no analytics connector is authorized this session; all funnel figures remain HELD/placeholder. Revenue $0 (pre-revenue, week 14, still no Stripe ticket).\n- **Decision needed:** Pick a push-credential mechanism for AWD-M-305 (scoped PAT in dev-agent env, or CI-side trigger). Nothing downstream is truly shipped until this is resolved.\n\n---\n\n## 2. Product & Engineering\n\n**Code items completed this window (merged to local `develop`):**\n\n| ID | Area | What |\n|----|------|------|\n| AWD-M-326 | Security / OWASP A01 | `get_current_active_user` on 21 reference-data GET endpoints — suspended accounts blocked |\n| AWD-M-325 | Security / DepSec | weasyprint 68.0 → 69.0 (CVE-2026-49452 / CSS-injection SSRF) |\n| AWD-M-322 | Security / DepSec | redis 5.2.1 → 8.0.1 + API contract tests |\n| AWD-M-324 | Hygiene | deleted 19 MB `dist_new/` debris, added to `.gitignore` |\n| AWD-L-86 | DepSec | pytest-cov 4.1.0 → 7.1.0 |\n| AWD-L-87 | Hygiene | closed as false-positive (DEV guards already present) |\n\n(AWD-M-319/320/321/122/323 landed 07-07→07-08, tail of the prior window.)\n\n**In progress / ready queue:** **Empty.** 0 items at `stage=ready`. All open items sit at `define` or `discover`, so the hourly dev-agent has idled through ~200+ \"no ready items\" runs this week. The loop is *starved, not stalled* — capacity exists, the queue does not feed it. Promoting a `define`-stage item (e.g. AWD-H-73 key rotation, or AWD-M-78 per-user AI quota) would give the loop something to absorb.\n\n**Code health (from qa-log, latest in-loop runs):**\n\n| Check | Result |\n|-------|--------|\n| TypeScript (`tsc --noEmit`) | 🟢 0 errors |\n| Lint (eslint, max-warnings 0) | 🟢 clean |\n| Frontend tests (vitest) | 🟢 314 passed |\n| Backend tests (pytest) | 🟢 1033 passed / 2 skipped (in-loop); ⚪ full suite not verifiable in sandbox (needs Postgres/Redis) |\n| Contracts (openapi.json, mcp.json) | 🟢 valid |\n| Last CI on `origin/develop` | ⚪ **not run** — commits never reached origin (AWD-M-305) |\n\n**Parent-flow vs educator-flow (Awade split):**\n- **Educator-flow:** AWD-M-321 (lesson-plan read/export role gating) was the one educator-specific code change; hardening only, no new capability.\n- **Parent-flow:** **No parent-flow code shipped this window.** The child-profile → first-guide funnel — repeatedly flagged as month-two's key gap — has no engineering work queued against it. All parent-flow motion this week was in content (see §4), not product.\n\n---\n\n## 3. Security\n\n- **Latest scan:** `security-report-2026-07-13.md` (06:00 UTC). **No Critical findings.** All CI security checks pass; auth, injection, and LLM defences remain strong.\n- **New findings filed:** **AWD-H-136** — local dev venv stale (starlette 0.46.2 installed vs 1.3.1 pinned; PYSEC-2026-161 Host-header injection present *locally only* — **production/Render is safe**; fix = reinstall requirements in venv). **AWD-M-327** — Prometheus `/metrics` endpoint unauthenticated.\n- **Open security backlog:** 0 Critical · 3 High (AWD-H-136 stale venv, AWD-H-79 QA sandbox venv, AWD-H-73 AI key rotation date unknown) · AWD-M-327.\n- No secrets committed; no `docs/private/` leakage; templates valid.\n\n---\n\n## 4. Marketing & Growth\n\n- **Content produced this window:** steady cadence across Twitter/X, LinkedIn, and Email — parent-empowerment (\"you don't have to know it already\"), the six-section How-to-Help guide walkthrough, multi-language home/instruction/exam framing, and Building-in-Public week-5/6 reviews. Mostly drafts + calendar-planned.\n- **Top theme:** parent-flow trust-building — normalizing parent unfamiliarity and demystifying guide contents, aimed squarely at the profile→first-guide drop-off.\n- **Growth metric vs last week:** **HELD.** BIP conversion figures remain placeholders \"until Tolu confirms\" — no analytics connector authorized, so the funnel number the content is built around still can't be published.\n- **Note:** `content-agent` has no heartbeat file (health WARNING) despite output landing — worth confirming its scheduled run is registered.\n\n---\n\n## 5. Operations & Finance\n\n- **Runway:** **Uncomputable** — `docs/agentic/finance/balance.md` still does not exist (day 80+ since first requested, 12 consecutive snapshots). One cash figure + one date remains the cheapest unblock in the finance file.\n- **Revenue:** $0 MRR/ARR, pre-revenue. Stripe not integrated (week 14); still no Stripe ticket in the backlog. OpenAI spend accruing uncaptured (`openai-costs.md` absent).\n- **Infrastructure — git gateway (AWD-M-305):** the week's dominant operational fact. `sync.sh push` denied in the sandbox; `develop` ahead of `origin`; `PULL_REBASE_FAILED`/`PUSH_DEFERRED` recurring daily through 07-13. **Requires Tolu decision.**\n- **Agent health (from `check-agent-health.sh`): CRITICAL.** Several scheduled agents have exceeded 2× their window: `finance-agent`, `growth-agent`, `daily-health-check`, `dependency-security-agent`, `improvement-agent`, `dashboard-refresh`. `content-agent` has no heartbeat file. These likely need their scheduled tasks restarted.\n\n---\n\n## 6. Backlog Health\n\n- **Open by severity:** 🔴 0 Critical · 🟠 3 High · 🟡 19 Medium · 🟢 3 Low · 🟣 0 GRC.\n- **By stage:** 16 `define` · 10 `discover` · 1 `design` · **0 `ready`** · 244 `done` (archive).\n- **Closed this window:** ~12 items.\n- **New this window:** AWD-H-136, AWD-M-327 (security scan); parent-flow funnel work still not filed as a buildable ticket.\n- **Structural gap:** the empty `ready` queue is a pipeline problem, not a capacity problem — pre-build stages (define/discover) hold 26 items but nothing is being promoted to `ready`.\n\n---\n\n## 7. This Week's Priorities\n\n1. **AWD-M-305 — fix the git gateway (founder decision).** Choose the push-credential path. Until origin receives commits, CI is dark and *nothing this fleet produces is actually shipped.* Single highest-leverage action.\n2. **Restart the CRITICAL scheduled agents** (finance, growth, daily-health-check, dependency-security, improvement, dashboard-refresh) and register `content-agent`'s heartbeat.\n3. **Promote one `define` item to `ready`** to feed the starved dev loop — AWD-H-73 (AI key rotation) or AWD-M-78 (per-user AI quota) are good candidates; both are real work the idle loop could absorb.\n\n- **Growth initiative:** file the parent-flow **profile → first-guide** funnel gap as a buildable backlog item — content has been selling it for a month with no product ticket behind it.\n- **Founder decision needed:** the AWD-M-305 push mechanism (scoped PAT vs CI-side trigger). This is the recurring blocker in both this review and the finance snapshot.\n\n---\n\n*Sources: `git log --since=\"7 days ago\"`, `docs/agentic/backlog.md`, `docs/agentic/completed_backlog.md`, `docs/agentic/sprints/{dev-log,qa-log}.md`, `docs/agentic/audits/security-report-2026-07-13.md`, `docs/agentic/content/content-log.md`, `docs/agentic/finance/snapshot-2026-07-10.md`, `.agent-health/sync-failures.log`, `scripts/check-agent-health.sh`. `gh` CLI unavailable in sandbox — CI pass rate not directly queried.*\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: awade-weekly-review output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "benchmark-2026-07-13.md", "path": "../performance/benchmark-2026-07-13.md", "category": "Performance", "agent": "performance-agent", "date": "2026-07-13", "content": "# Performance Report — 2026-07-13\n\n## Summary\n\n| Metric | Value | Threshold | Status |\n|--------|-------|-----------|--------|\n| API p50 (key endpoints) | unmeasured (8th consecutive week) | 300ms | ⚪ gap — see Findings |\n| Initial JS (entry + 5 modulepreloaded vendor chunks, gz) | 133,286 B (≈130.2 KB) | 300 KB | 🟢 |\n| Initial CSS (gz) | 10,897 B (≈10.6 KB) | — | 🟢 |\n| N+1 patterns on request path | 0 | 0 | 🟢 |\n| Backend deps (`requirements.txt`) | 33 | — | 🟢 flat |\n| Frontend deps (runtime / dev) | 9 / 22 | — | 🟢 flat |\n| Real user metrics (LCP/CLS/INP) | not available — no analytics MCP connected | — | ⚪ gap |\n\n## Regressions vs. Prior Week\nNone detected. Every measured metric is flat against `baseline.md` (2026-07-06):\n\n- Initial JS: 133,272 B → 133,286 B gz (+14 B, +0.01%) — well inside noise, not a regression.\n- Initial CSS: 10,897 B → 10,897 B gz — byte-identical.\n- Entry chunk `index-*.js`: 277,626 B raw / 56,144 B gz → 274,403 B raw / 56,158 B gz (−3,223 B raw, +14 B gz) — raw app code shrank slightly, gzip flat; noise, no regression.\n- `vendor-react` chunk: 142,321 B raw / 45,731 B gz — byte-identical to baseline.\n- `vendor-router` chunk: 22,635 B raw / 8,484 B gz — byte-identical to baseline.\n- `vendor-query` chunk: 35,670 B raw / 10,567 B gz — byte-identical to baseline.\n- `vendor-icons` chunk: 36,339 B raw / 11,167 B gz — byte-identical to baseline.\n- `vendor-auth` chunk: 2,555 B raw / 1,179 B gz — byte-identical to baseline.\n- Backend deps: 33 → 33 — unchanged.\n- Frontend deps: 9 runtime / 22 dev — unchanged.\n- N+1 sites: 0 → 0 (re-confirmed `curriculum_service.py:339-351` — two set-based queries, not a per-row loop; see Findings).\n\n## Findings\n\n### Build\nRan a clean `vite build --outDir dist_perf` (fresh outDir, not reusing the in-tree `dist/`) against the current `develop` source tree — built in 2.79s, no errors.\n\nInitial JS = entry chunk (`index-BZvoTHgB.js`) + the 5 chunks `index.html` marks `modulepreload`: `vendor-react`, `vendor-router`, `vendor-query`, `vendor-icons`, `vendor-auth`. Gzip sizes measured with `gzip -c` (level 6).\n\n| Chunk | Raw | Gzip |\n|---|---:|---:|\n| `index-BZvoTHgB.js` (entry) | 274,403 B | 56,158 B |\n| `vendor-react` | 142,321 B | 45,731 B |\n| `vendor-icons` | 36,339 B | 11,167 B |\n| `vendor-query` | 35,670 B | 10,567 B |\n| `vendor-router` | 22,635 B | 8,484 B |\n| `vendor-auth` | 2,555 B | 1,179 B |\n| **Initial JS total** | **513,923 B** | **133,286 B** |\n| `vendor-sentry` (not modulepreloaded, lazy) | 87 B | 127 B |\n| `index-*.css` | 68,154 B | 10,897 B |\n\n`vendor-sentry` (Sentry wired per AWD-H-01) is not `modulepreload`ed by `index.html`, so it is correctly excluded from the initial-JS figure — 87 B raw regardless.\n\nRoute-level code splitting: still none — all routes ship in the single entry chunk. Pre-existing observation (noted every prior week), a design choice rather than a regression; not filed.\n\n### N+1 scan\nHeuristic scan across `apps/backend/routers/` and `apps/backend/services/` (excluding tests) surfaced query calls near loops; the only request-path candidate remains `curriculum_service.py`. Inspected lines 339–351: `structure_ids` is built from a single `db.query(CurriculumStructure).filter(...).all()`, and `topics` is then fetched with a single `.filter(Topic.curriculum_structure_id.in_(structure_ids)).all()`. Two set-based queries, not a per-row loop — confirmed **not** an N+1, consistent with the AWD-M-165 aggregation fix. All other loop-adjacent query hits are in one-off data-population/migration scripts (`populate_*.py`) that run outside the request path.\n\n### API latency — 8th consecutive week unmeasured\nNo local server was reachable in the sandbox: ports 8000/8080/3000/5000 all returned no response, no `uvicorn`/`fastapi` process running, Docker absent from the sandbox. This is the 8th consecutive weekly run without a synthetic latency measurement (2026-05-11 → 2026-07-13). Already tracked by **M-318** (`docs/agentic/backlog.md`, stage=define) — decide whether to stand up a lightweight in-sandbox uvicorn instance or retire the synthetic check in favor of Sentry (wired AWD-H-01) as the real-user-latency source. Not re-filed.\n\n### Dependency audit\n`requirements.txt`: 33 packages, unchanged from baseline — no new heavy dependencies. Frontend: 9 runtime / 22 dev, unchanged. No single dependency over the 1 MB flag threshold introduced.\n\n### Build artifact note\nThe clean build for this run was written to `apps/frontend/dist_perf/`. The sandbox's mount permissions blocked deletion after measurement (same limitation as the `dist_new/` note in prior weeks). Unlike `dist/` and `dist_new/`, **`dist_perf/` is not currently in `apps/frontend/.gitignore`**, so it shows as an untracked directory. It contains only standard Vite build output — no source files were touched. Two low-effort remediations for Tolu / the dev-agent: (a) delete `apps/frontend/dist_perf/` manually, and (b) either add `dist_perf/` to `apps/frontend/.gitignore` or have this agent reuse the already-ignored `dist_new/` outDir next week. The dev-agent's `sync.sh` stages only specific paths (`docs/`, `scripts/`, `agent-permissions.json`), so this directory will not be committed by the normal sync flow.\n\n## Backlog Items Filed\nNone. All measured metrics are flat and within threshold. The one open gap (API latency) is already tracked by M-318.\n\n## Baseline Update\n`docs/performance/baseline.md` updated: bundle figures refreshed to today's clean-build measurement (flat vs. prior week), backend/frontend dependency counts confirmed unchanged (33 / 9 / 22), N+1 re-confirmed at 0, API latency gap counter advanced to 8 consecutive weeks.\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: performance-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-07-13.md", "path": "../agentic/audits/security-report-2026-07-13.md", "category": "Security audit", "agent": "security-agent", "date": "2026-07-13", "content": "# Security Report — 2026-07-13\n\n**Agent:** security-agent  \n**Run:** 2026-07-13 06:00 UTC (scheduled — second run, updates earlier same-day report)  \n**Scope:** Full CI mirror + OWASP Web Top 10 + OWASP LLM Top 10\n\n---\n\n## Summary\n\n**No Critical findings. Two new findings filed:** H-136 (local dev venv stale — vulnerable starlette 0.46.2 installed vs 1.3.1 required) and M-327 (Prometheus `/metrics` endpoint unauthenticated). All CI security checks pass. Auth, injection, and LLM defences remain strong.\n\n---\n\n## 1. CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| `git ls-files \\| grep -E '\\.(env\\|key\\|pem\\|p12)$'` | ✅ Empty — no committed secret files |\n| `git ls-files \\| grep \"docs/private/\"` | ✅ Empty — no private docs committed |\n| `test -f .env.example` | ✅ Present |\n| `python -m json.tool .cursor/mcp.json` | ✅ Valid JSON |\n| `python -m json.tool apps/backend/app/openapi.json` | ✅ Valid JSON |\n\n---\n\n## 2. Secret Scan\n\nGrep for `sk_live`, `sk_test`, `AIza`, `password\\s*=`, `api_key\\s*=` across `apps/` and `packages/` (excluding node_modules, __pycache__, test files, examples):\n\n**All matches reviewed — none are hardcoded secrets:**\n\n| File | Match | Assessment |\n|------|-------|------------|\n| `apps/backend/init_db.py:64` | `admin_password = os.getenv(\"ADMIN_PASSWORD\")` | Reads from env ✅ |\n| `apps/backend/init_db.py:82` | `educator_password = os.getenv(\"EDUCATOR_PASSWORD\")` | Reads from env ✅ |\n| `apps/backend/redis_client.py:17` | `password=REDIS_PASSWORD` | Variable sourced from env ✅ |\n| `apps/backend/tests/conftest.py:297` | `api_key=\"test\"` | Test fixture only ✅ |\n| `packages/ai/providers/openai_provider.py:27` | `api_key or os.getenv(\"OPENAI_API_KEY\")` | Env-sourced ✅ |\n| `packages/ai/providers/gemini_provider.py:30` | `api_key or os.getenv(\"GEMINI_API_KEY\")` | Env-sourced ✅ |\n\n**Result: CLEAN** — No hardcoded secrets found.\n\n---\n\n## 3. Dependency Audit\n\n### Frontend\n```\nnpm audit --production → 0 vulnerabilities\n```\n\n### Backend (key security-relevant packages)\n\n| Package | Installed (venv) | Required (requirements.txt) | Status |\n|---------|------------------|-----------------------------|--------|\n| `fastapi` | 0.115.12 | **0.137.1** | ⚠️ STALE |\n| `starlette` | 0.46.2 | **1.3.1** | ⚠️ STALE — **PYSEC-2026-161** |\n| `pydantic` | 2.6.4 | (≥2.6.4) | ⚠️ Minor lag |\n| `bcrypt` | 4.3.0 | 4.3.0 | ✅ |\n| `PyJWT` | 2.13.0 | 2.13.0 | ✅ |\n| `cryptography` | 46.0.6 | 46.0.6 | ✅ |\n| `openai` | 1.109.1 | 1.109.1 | ✅ |\n| `sentry-sdk[fastapi]` | 2.58.0 | 2.58.0 | ✅ |\n\n**⚠️ CRITICAL GAP: Local venv is significantly behind `requirements.txt`.** The AWD-H-126 fix (bump fastapi 0.121.3→0.137.1, starlette 0.49.3→1.3.1) was applied to `requirements.txt` in June 2026 but the local venv at `venv/` was never updated. The installed starlette 0.46.2 contains **PYSEC-2026-161** (Host header URL injection via unvalidated `Host` header, fixed at 1.0.1). Any local dev server run against this venv uses the vulnerable version. Production (Render) installs from `requirements.txt` directly and is safe.\n\n**Fix:** `venv/bin/pip install -r apps/backend/requirements.txt` — filed as **H-136**.\n\n---\n\n## 4. OWASP Web Top 10\n\n### 1. Broken Access Control ✅\n- All non-public routes protected by FastAPI `Depends()`:\n  - Parent routes → `require_parent` (`PARENT | ADMIN | SUPER_ADMIN`) ✅\n  - Educator routes → `require_educator` (`EDUCATOR`) ✅\n  - Admin routes → router-level `dependencies=[Depends(require_admin)]` + per-endpoint guards ✅\n  - Reference data GET routes → `get_current_active_user` (suspension check enforced, M-326 resolved) ✅\n- Ownership enforcement verified:\n  - `ChildProfile` access: `_get_child_or_404(child_id, parent_id)` filters by `parent_id == user.user_id` ✅\n  - `ParentGuide` access: joins `ChildProfile` and filters `ChildProfile.parent_id == user.user_id` ✅\n\n### 2. Cryptographic Failures ✅\n- JWT signed with HS256 + `JWT_SECRET_KEY` from env ✅\n- Dev-secret fallback raises `RuntimeError` outside `{development, test, testing}` environments ✅\n- bcrypt used for password hashing ✅\n- Auth tokens in httpOnly cookies (access + refresh), not localStorage ✅\n- Password reset tokens: SHA-256 hashed before storage; 1-hour expiry; cleared after use ✅\n\n### 3. Injection ✅\n- **SQL**: SQLAlchemy ORM throughout; no f-string SQL construction found in routers or services ✅\n- **XSS**: No `dangerouslySetInnerHTML` in frontend source ✅\n- **Prompt injection**: See OWASP LLM section ✅\n- Pydantic schemas enforce type/length validation on all request bodies ✅\n\n### 4. Insecure Design ✅\n- COPPA: child data (name, grade, country) is parent-mediated; children never interact with the API directly ✅\n- No child-facing API surface; child profile data only accessible via `require_parent` ✅\n\n### 5. Security Misconfiguration ✅ (with observation)\n- CORS: wildcard `*` converted to `localhost`-only allowlist when env var is generic ✅\n- API docs hidden in production (`docs_url=None` when `ENVIRONMENT=production`) ✅\n- `TrustedHostMiddleware` enforces explicit `ALLOWED_HOSTS` outside dev/test environments ✅\n- Rate limiting on all auth endpoints ✅\n- Security headers (`X-Content-Type-Options`, `X-Frame-Options`, `HSTS`, `CSP`, `Referrer-Policy`) set by `SecurityHeadersMiddleware` ✅\n- **Observation (M-327):** `Instrumentator().expose(app)` at `main.py:237` exposes `/metrics` (Prometheus) unauthenticated on the same port as the API. This endpoint leaks route names, request volumes, error rates, and latency percentiles to any caller. Filed as **M-327**.\n\n### 6. Vulnerable Components ✅ (production) / ⚠️ (local)\n- Production: Render installs from `requirements.txt` — all pinned versions current. 0 npm vulnerabilities. ✅\n- Local: venv stale (see Dependency Audit). Filed as **H-136**.\n\n### 7. Identification & Auth Failures ✅\n- Rate limits on auth endpoints: login (10/min), signup (5/min), Google OAuth (10/min), forgot-password (5/min), reset-password (5/min), token refresh (20/min) ✅\n- Account enumeration protection:\n  - Login: generic `\"Invalid email or password\"` for both wrong email and wrong password ✅\n  - Registration: generic `\"Registration failed — please check your details and try again\"` for existing emails (H-133 resolved) ✅\n  - Password reset: `\"If the email exists, a password reset link has been sent\"` (constant response) ✅\n  - OAuth (Google) with email/password conflict: same generic `\"Invalid email or password\"` ✅\n- `JWT_SECRET_KEY` required at startup in non-dev environments ✅\n- Token blacklist service (`token_service.py`) blacklists refresh tokens on logout ✅\n- Suspended user check in `get_current_active_user` ✅\n\n### 8. Software & Data Integrity ✅\n- `package-lock.json` and `requirements.txt` committed ✅\n- No use of `--no-verify` in workflow ✅\n\n### 9. Logging & Monitoring ✅\n- Sentry wired up (`sentry-sdk[fastapi]==2.58.0`, AWD-H-01); `send_default_pii=False` (COPPA/GDPR safe) ✅\n- Structured logging via Python `logging` module throughout backend ✅\n- Admin actions logged to `admin_audit_logs` table ✅\n- Child profile names/IDs not present in any log call reviewed ✅\n- `AuditMiddleware` attributes requests to `user_id` via `request.state.user_id` (set in `get_current_user`) ✅\n- **Observation (Low/hygiene):** `/health` endpoint returns hardcoded `\"timestamp\": \"2024-01-01T00:00:00Z\"` — misleading for any monitoring tool that parses this field. No security impact but could cause false alerts. Not filed (Low hygiene, not security-relevant).\n\n### 10. SSRF ✅\n- No URL-fetching endpoints identified ✅\n- WeasyPrint upgraded to 69.0 (M-325 resolved) — CVE-2026-49452 (SSRF via CSS injection) fixed ✅\n\n---\n\n## 5. OWASP LLM Top 10\n\n### LLM01 — Prompt Injection ✅ (strong)\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: user-supplied `local_context` wrapped in `<user_context>` delimiter tags with explicit sandboxing instruction ✅\n- `PARENT_HELPER_PROMPT`: all curriculum fields wrapped in `<curriculum_data>` delimiter tags ✅\n- `_sanitize_user_context()` applies three defensive layers (AWD-M-12):\n  1. Truncation to 2,000 chars (prevents token-stuffing)\n  2. PII stripping (API keys, emails, phones)\n  3. 17+ injection-pattern detection (DAN, roleplay-as-unrestricted, developer mode, fake role tags, etc.) ✅\n- Delimiter tag strings stripped from user input to prevent fake-tag escape (AWD-M-198 + AWD-M-266 for case-insensitive) ✅\n- Shared injection pattern list prevents input-gate / output-gate drift (AWD-M-158) ✅\n- `_sanitize_input()` applied to all individual fields before template substitution; assembled prompt not re-sanitised (preserves delimiter tags, AWD-H-128) ✅\n\n### LLM02 — Insecure Output Handling ✅\n- `validate_output()`: two-pass validation for lesson resources (content-safety → structure) ✅\n- `_validate_parent_guide()`: mirrors two-pass validation for parent guides ✅\n- `generate_guide` raises `HTTPException(502)` immediately when `is_valid=False` — prevents PII/injection-containing guides from being persisted or exported as PDF (H-134 resolved) ✅\n- Frontend renders AI content in `<pre>` plain text (no `dangerouslySetInnerHTML`, `ContentPreviewModal.tsx:72`) ✅\n\n### LLM03 — Training Data Poisoning\n- N/A: No fine-tuning ✅\n\n### LLM04 — Model DoS ✅\n- Guide generation: `@limiter.limit(\"5/minute\")` ✅\n- Export: `@limiter.limit(\"5/minute\")` ✅  \n- Lesson resources: `@limiter.limit(\"60/minute\")` (H-135 resolved) ✅\n- `AI_MAX_TOKENS` env var caps token usage ✅\n\n### LLM05 — Supply Chain ✅\n- `openai==1.109.1` pinned in `requirements.txt` ✅\n- `google-generativeai` (Gemini) also pinned ✅\n\n### LLM06 — Sensitive Info Disclosure ✅\n- Child name **not** passed into AI prompts — only curriculum data (topic, subject, grade, country, objectives, contents) ✅\n- `_sanitize_input()` strips API keys, emails, phone numbers from all fields before prompt insertion ✅\n- `_OUTPUT_PII_PATTERNS` gate catches any model-emitted PII before persisting ✅\n\n### LLM09 — Overreliance ✅\n- Mock fallback returns safe default content when provider is unavailable ✅\n- `is_valid=False` flag propagated to callers; logged with warning ✅\n\n### LLM10 — Model Theft\n- N/A ✅\n\n---\n\n## 6. Findings Filed to Backlog\n\n### H-136 — Local dev venv stale: starlette 0.46.2 installed, 1.3.1 required (PYSEC-2026-161)\n\n**Summary:** The AWD-H-126 dependency bump (fastapi 0.121.3→0.137.1, starlette 0.49.3→1.3.1) was applied to `requirements.txt` in June 2026 but the local venv at `venv/` was not updated. The installed starlette 0.46.2 has PYSEC-2026-161 (Host header URL injection, fixed at 1.0.1). Any local `venv/bin/python` invocation (dev server, pytest, scripts) runs against the vulnerable version.\n\nProduction (Render) installs fresh from `requirements.txt` and is safe. However, local test runs produce results for the wrong version — any starlette-version-sensitive test may give false confidence.\n\n**Fix:** `venv/bin/pip install -r apps/backend/requirements.txt`\n\n### M-327 — Prometheus /metrics endpoint exposed without authentication\n\n**Summary:** `Instrumentator().expose(app)` at `apps/backend/main.py:237` registers a `/metrics` endpoint on the same port and router as all other API routes. This endpoint is publicly accessible without any authentication and returns detailed Prometheus metrics including: route names, HTTP method breakdowns, request counts, latency histograms, and error rates. An unauthenticated caller can enumerate all API route patterns and monitor traffic volume.\n\n**Fix:** Gate `/metrics` behind basic auth using `Instrumentator(should_gzip=True).expose(app, should_gzip=True, include_in_schema=False)` with an `authentication` callback, or restrict the endpoint to an internal IP range via a middleware check.\n\n---\n\n## 7. Open Security Items (snapshot)\n\n| ID | Area | Summary | Stage |\n|----|------|---------|-------|\n| H-136 | Security / DepSec | Local dev venv stale — starlette 0.46.2 installed vs 1.3.1 required (PYSEC-2026-161) | discover |\n| H-73 | Security / Secrets | AI API key rotation date unknown; GEMINI_API_KEY, OPENAI_API_KEY, GOOGLE_API_KEY have no recorded rotation date | define |\n| H-79 | Tooling / QA | Set up venv + pytest in QA sandbox; free disk space for frontend tests | discover |\n| M-327 | Security / OWASP A05 | Prometheus /metrics endpoint unauthenticated — info disclosure (routes, volumes, latencies) | discover |\n| M-269 | SEO / Content | No SEO surface for GTM keyword clusters — needs Tolu product decision | define |\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "retro-2026-07-11.md", "path": "../agentic/weekly-reviews/retro-2026-07-11.md", "category": "Retrospective", "agent": "weekend-ops", "date": "2026-07-11", "content": "# Weekly Retro — 2026-07-11 (Sat)\n\n**Window**: 2026-07-04 → 2026-07-11 · **Author**: weekend-ops agent\n\n---\n\n## Velocity\n\n| Metric | Value | Notes |\n|--------|-------|-------|\n| Commits (7 days) | 229 total / ~31 substantive | Bulk is `chore(sync)` heartbeats; substantive = feat/fix/test/docs on issues |\n| Issues completed | **12** | L-85, L-38, M-206, M-122, M-319, M-320, M-321, M-323, L-86, M-324, M-326, M-325 |\n| Content pieces | 6 drafted/planned this week | Mon 2-post (07-06), teacher thread (07-07), LinkedIn languages post (07-08), guide-anatomy email (07-09), week-5 BIP review (07-10); 07-13→17 calendar planned |\n| CI pass rate | **Unmeasurable** | `gh` unavailable in sandbox; pushes to origin deferred (M-305) so CI may not be running at all on this week's merges |\n\n## What Shipped\n\nAll landings this week were **security/hardening and infra** — zero new product features, consistent with the declared hardening focus.\n\n**Security (5)**\n- M-321 — `require_educator` enforced on 5 lesson-plan GET endpoints + export POST (educator-flow)\n- M-326 — suspended accounts blocked on 21 reference-data GET endpoints (`get_current_active_user`) (shared)\n- M-325 — weasyprint 68.0 → 69.0, upstream fix for CVE-2026-49452 (shared/export)\n- M-323 — 3 static-analysis regression tests guarding the same CVE vector (shared)\n- L-85 — `console.error` gated behind DEV flag in api.ts (shared)\n\n**UX / Settings (3)** — M-122 (SettingsPage 739-line split into tab components), M-319 (duplicate getCurrentUser eliminated), M-320 (silent save-error catch now surfaces a role=\"alert\" banner) (shared, both roles)\n\n**Deps (2)** — L-38 (react-icons 4→5), L-86 (pytest-cov 4 park them so they stop polluting grooming passes.\n\n## Backlog Health\n\n| Severity | Open | Stage breakdown | Notes |\n|----------|------|-----------------|-------|\n| 🔴 Critical | 1 | C-13 (define) | Staged-index reversion — needs Tolu to identify the offending tool |\n| 🟠 High | 2 | H-73 (define), H-79 (discover) | H-79 moved from stray \"📋 Open\" section into High table this run |\n| 🟡 Medium | 18 | 12 define · 6 discover | M-269 moved from Critical table (misfiled) to Medium this run; 6+ blocked on Tolu decisions |\n| 🟢 Low | 3 | 1 define · 2 discover | L-07 blocked on Tolu confirmation |\n| 🟣 GRC | 0 | — | Clean |\n| **Total** | **24** | **0 ready** | 12 completed this week; format validator ✓ 272 rows OK |\n\n**Grooming actions taken this run**: relocated M-269 (Medium ID misfiled under 🔴 Critical) to the Medium table; relocated H-79 from the malformed \"📋 Open\" section into the 🟠 High table. All 24 open Medium/Low items reviewed — descriptions remain accurate and parent-pivot-aligned; no stale items found; no priority changes warranted. Validator passes.\n\n---\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: weekend-ops output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-11-9da37bb.md", "path": "../code-reviews/review-2026-07-11-9da37bb.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-11", "content": "# Code Review — 2026-07-11 · 9da37bb\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 6\n**Commits covered**: 9da37bb (fix/security/AWD-M-326-active-user-check-reference-data)\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\nNo 🔴 or 🟠 findings.\n\n### Observation (🟢 Low — non-blocking)\n\n**`apps/backend/tests/test_suspension_reference_data_m326.py` — `_depends_on_active_user`**\n\n`isinstance(default, type(Depends(get_current_active_user)))` allocates a throwaway `Depends` instance on every call solely to obtain its class for `isinstance`. Equivalent and cleaner: `from fastapi.params import Depends as DependsClass; isinstance(default, DependsClass)`. Functionally identical; no behavioural impact.\n\n## Backlog Items Filed\n\nNone — observation is 🟢 Low, does not cross the 🟠 threshold for filing.\n\n## Notes\n\n- Change is minimal and correctly scoped. All 21 affected GET endpoints had the same one-line substitution: `Depends(get_current_user)` → `Depends(get_current_active_user)`. No collateral changes.\n- Imports updated correctly in all five files; `get_current_user` no longer appears anywhere in the five routers.\n- Test suite uses `inspect.signature` introspection to assert the dependency at the function-parameter level — this is the right layer for a structural regression test. 21/21 parametrized cases pass.\n- No new files were created (test file aside), so `codebase-map.md` update is not required for the router changes.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "security-report-2026-07-11.md", "path": "../agentic/audits/security-report-2026-07-11.md", "category": "Security audit", "agent": "security-agent", "date": "2026-07-11", "content": "# Security Audit Report — 2026-07-11\n\n**Agent**: security-agent  \n**Run date**: 2026-07-11  \n**Branch**: develop  \n**Scope**: CI security job mirror + Secret scan + Dependency audit + OWASP Web Top 10 + OWASP LLM Top 10\n\n---\n\n## CI Security Job Mirror\n\n| Check | Result |\n|-------|--------|\n| No committed secret files (`*.env`, `*.key`, `*.pem`, `*.p12`) | ✅ PASS |\n| No `docs/private/` in git | ✅ PASS |\n| `.env.example` exists | ✅ PASS |\n| `.cursor/mcp.json` valid JSON | ✅ PASS |\n| `apps/backend/app/openapi.json` valid JSON | ✅ PASS |\n\n---\n\n## Secret Scan\n\n`grep` across `apps/` and `packages/` for `sk_live`, `sk_test`, `AIza`, `password\\s*=`, `api_key\\s*=`:\n\nAll matches are legitimate patterns:\n- `apps/backend/init_db.py` — `os.getenv(\"ADMIN_PASSWORD\")` / `os.getenv(\"EDUCATOR_PASSWORD\")` — env reads, not hardcoded\n- `apps/backend/redis_client.py` — `password=REDIS_PASSWORD` where `REDIS_PASSWORD` is an env variable\n- `apps/backend/tests/conftest.py` — `api_key=\"test\"` — test fixture sentinel, not a live key\n- `packages/ai/providers/openai_provider.py` — `api_key or os.getenv(\"OPENAI_API_KEY\")` — proper env fallback\n- `packages/ai/providers/gemini_provider.py` — `api_key or os.getenv(\"GEMINI_API_KEY\")` — proper env fallback\n\n**Result**: ✅ No hardcoded secrets found.\n\n---\n\n## Dependency Audit\n\n### Frontend (npm audit)\n```\nfound 0 vulnerabilities\n```\n✅ Clean.\n\n### Backend\n`pip list --outdated` run; security-relevant packages checked:\n\n| Package | Installed (requirements.txt) | Latest | Status |\n|---------|------------------------------|--------|--------|\n| weasyprint | 68.0 | 69.0 | ⚠️ 68.1 and 69.0 now available — check if GHSA-jhhc-3hcp-qhm5 is patched (M-325) |\n| cryptography | 48.0.1 | latest | ✅ (bumped AWD-M-301) |\n| fastapi | current | — | No CVE |\n| pyjwt | current | — | No CVE |\n| openai | current | — | No CVE |\n\n**Note on weasyprint**: AWD-M-323 mitigated GHSA-jhhc-3hcp-qhm5 with static analysis regression tests (no `presentational_hints` passed to WeasyPrint). Versions 68.1 and 69.0 are now available; changelog review is needed to determine if one of these releases contains the upstream fix. Filed **M-325** to check and bump if patched.\n\n---\n\n## OWASP Web Top 10 Checks\n\n### A01 — Broken Access Control\n- **Auth on routes**: All routers audited. `children.py`, `lesson_plans.py`, `admin.py`, `users.py`, `contexts.py`, `auth.py` all use `get_current_active_user` or role-specific guards (`require_educator`, `require_parent`, `require_admin`, etc.) correctly.\n- **Reference-data routes**: 26 GET endpoints across `curriculum.py` (6), `country.py` (4), `grade_level.py` (5), `subject.py` (4), `curriculum_structure.py` (2), and `admin.py` use `get_current_user` instead of `get_current_active_user`. This means **suspended users can still query curriculum reference data** (topic lists, country names, grade levels, subjects). These routes return non-PII public reference data only, but a suspended account receiving no access is the correct platform behavior. Filed **M-326** to replace with `get_current_active_user` across these 26 endpoints. ⚠️\n- **Public uploads**: `/uploads` static mount is unauthenticated — profile images are publicly accessible by direct URL. Acceptable for images (no PII attached to filenames); no change warranted.\n- **Admin routes**: `admin.py` uses `require_admin` / `require_super_admin` correctly.\n- **OpenAPI docs**: Disabled (`docs_url=None`) when `ENVIRONMENT=production`. ✅\n\n### A02 — Cryptographic Failures\n- JWT signed with HS256 via PyJWT; `get_jwt_secret_key()` raises `RuntimeError` in production if `JWT_SECRET_KEY` is unset (dev-secret fallback restricted to `development`/`test`/`testing` environments). ✅\n- Tokens stored in HttpOnly cookies (verified `AuthContext.tsx` and `api.ts`). ✅\n- `localStorage` not used for auth tokens. ✅\n- bcrypt used for password hashing (via auth_service). ✅\n\n### A03 — Injection\n- All SQL via SQLAlchemy ORM; no f-string user input into queries found. ✅\n- Pydantic schemas validate all request bodies. ✅\n- User input sanitized before prompt insertion (`_sanitize_input`, delimiter-tag stripping, `_INPUT_INJECTION_PATTERNS`). ✅\n\n### A05 — Security Misconfiguration\n- CORS: Configured with explicit allowed origins; defaults to localhost ports when `ALLOWED_ORIGINS=*` (wildcard converted to specific origins, avoids credentials + wildcard issue). ✅\n- Rate limiting: Applied to all routers (`limiter` from `apps/backend/limiter.py`). ✅\n- `TrustedHostMiddleware` present in `main.py`. ✅\n\n### A07 — Identification & Authentication Failures\n- Account enumeration: Login errors are generic (checked `auth.py`). ✅\n- Login rate limited at 5/minute (`auth.py:209`). ✅\n- Suspension check: `get_current_active_user` checks `is_suspended` — but see A01 note on reference-data routes not using this guard.\n\n### A09 — Security Logging & Monitoring\n- Structured logger used throughout; no bare `print()` or `console.log` in production paths. ✅\n- AuditMiddleware records `request.state.user_id` (AWD-M-197). ✅\n- Sentry wired (AWD-H-01). ✅\n\n---\n\n## OWASP LLM Top 10 Checks\n\n### LLM01 — Prompt Injection\n- `COMPREHENSIVE_LESSON_RESOURCE_PROMPT`: User-supplied `local_context` wrapped in `<user_context>...<\/user_context>` delimiters; sanitized via `_sanitize_input()` before insertion. ✅\n- `PARENT_HELPER_PROMPT`: All curriculum fields wrapped in `<curriculum_data>...<\/curriculum_data>` delimiters. ✅\n- Delimiter tag stripping prevents fake closing tag escape (AWD-M-198). ✅\n- `_INPUT_INJECTION_PATTERNS` list covers jailbreak variants (ignore-instructions, pretend-unrestricted, DAN, developer-mode, no-restrictions, roleplay-unrestricted). ✅\n- Shared injection patterns (`_SHARED_INJECTION_PATTERNS`) used for both input sanitizer and output gate so lists stay in sync (AWD-M-158). ✅\n\n### LLM02 — Insecure Output Handling\n- `validate_output()` (lesson resource) and `_validate_parent_guide()` (parent guide): Both run a two-pass validation — (1) content-safety scan on raw string, (2) JSON parse + required-field check. ✅\n- `ContentPreviewModal.tsx` renders AI output inside `<pre>` as plain text, no `dangerouslySetInnerHTML`. ✅\n- AI disclosure banners present on all AI-generated content views (AWD-M-196 confirmed). ✅\n\n### LLM06 — Sensitive Information Disclosure\n- Child names, parent emails, and user IDs are NOT included in AI prompts — confirmed by review of `_build_guide_ai_payload()`. Only curriculum metadata (subject, grade, topic, country) passed. ✅\n- PII patterns (`email`, `phone`, API keys) checked in `_OUTPUT_PII_PATTERNS` before persisting AI output. ✅\n\n### LLM04 — Model Denial of Service (Unbounded Consumption)\n- AI generation endpoint rate-limited at 5/minute for guide generation (`children.py:192`) and 5/minute for lesson resource generation (`lesson_plans.py:48`). ✅\n- `AI_MAX_TOKENS` defaults to 8192 and is env-configurable. ✅\n- **Free-tier per-user quota** (AWD-M-78) still unresolved — still `define` stage. Not blocking at current traffic levels.\n\n### LLM05 — Supply-Chain\n- `openai` SDK pinned in `requirements.txt`. ✅\n- `requirements.txt` committed. ✅\n\n---\n\n## Summary\n\n| Severity | Count | Notes |\n|----------|-------|-------|\n| Critical | 0 | — |\n| High | 0 | — |\n| Medium | 2 | M-325 (weasyprint upgrade check), M-326 (suspended users bypass on 26 ref-data endpoints) |\n| Low | 0 | — |\n| Pass | All CI + secret scan + OWASP items not listed above | — |\n\n### New backlog items filed this run\n- **M-325** — DepSec: check weasyprint 68.1/69.0 changelog; bump `requirements.txt` if GHSA-jhhc-3hcp-qhm5 is patched\n- **M-326** — Security/OWASP A01: replace `get_current_user` with `get_current_active_user` on 26 reference-data GET endpoints across 5 routers\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-10-6c3a4c8.md", "path": "../code-reviews/review-2026-07-10-6c3a4c8.md", "category": "Code review", "agent": "c
