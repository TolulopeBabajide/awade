y (structural) | 0 | — |\n| API / Config Design | 1 | 🟠 |\n\n## Findings\n\n### apps/frontend/package.json\n\n- **🟠 High** — `\"nanoid\": \">=3.3.18\"` override resolved to nanoid **6.0.1**, which declares `\"engines\": { \"node\": \"^22 || ^24 || >=26\" }`. CI runs Node 20 (`.github/workflows/ci.yml`). Semver-unrestricted `>=` across major versions is the root cause — the override jumped from v3 to v6.\n  **Fix**: Change to `\"nanoid\": \"^3.3.18\"` — stays on the v3 line (Node 10+ compatible), patches GHSA-2v37-7h3g-55p8, and avoids pulling a Node-22-only major.\n\n## Backlog Items Filed\nNone — this is a correctable issue within the same branch; the dev agent should fix inline before committing.\n\n## Notes\n- The security intent is correct: GHSA-2v37-7h3g-55p8 (nanoid < 3.3.18 infinite loop) is addressed.\n- package-lock.json correctly reflects the override in `node_modules/nanoid`.\n- Fix is a one-character change to package.json + re-run of `npm install`.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-08-06-8fa3940.md", "path": "../code-reviews/review-2026-08-06-8fa3940.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-08-06", "content": "# Code Review — 2026-08-06 · 8fa3940\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 4\n**Commits covered**: 8fa3940 (AWD-M-331 — extract shared verify_parent/get_child_or_404)\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 (resolved by this change) | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n| Unused imports | 2 | 🟡 |\n\n## Findings\n\n### apps/bac ry": "Code review", "agent": "code-review-agent", "date": "2026-08-05", "content": "# Code Review — 2026-08-05 · a82eefb\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 1\n**Branch**: `fix/children/AWD-M-332-test-class-naming`\n**Issue**: AWD-M-332 — split `TestChildrenServiceDBErrors` into two accurately-named classes\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | ✅ None |\n| Complexity | 0 | ✅ None |\n| Duplication | 0 | ✅ None |\n| Coupling | 0 | ✅ None |\n| Naming | 2 | 🟢 Low |\n| Error Handling | 0 | ✅ None |\n| Security (structural) | 0 | ✅ None |\n| API Design | 0 | ✅ None |\n\n## Findings\n\n### apps/backend/tests/test_children_service_db_errors.py\n\n- **🟢 Low** Line 201: `cs` is a single-abbreviation local variable holding a curriculum-structure mock. Non-obvious to a reader unfamiliar with the domain shorthand.\n  Fix: rename to `mock_cs` and add `# curriculum_structure` inline comment, or use the full name `mock_curriculum_structure`.\n\n- **🟢 Low** Line 208: `call_count = [0]` is the standard Python mutable-container closure trick. Correct but non-obvious.\n  Fix: add a one-line comment: `# list for mutability in nested closure`.\n\n## Backlog Items Filed\n\nNone — 🟢 Low findings only; no backlog filing threshold met.\n\n## Notes\n\n- The split is precisely correct: `TestChildrenServiceDBErrors` (6 tests, ChildrenService only) and `TestParentGuideServiceDBErrors` (2 tests, ParentGuideService only). Each class now has a single responsibility aligned with the service it covers.\n- Removal of the unused `_simple_db` helper is clean housekeeping — it was never called by any test.\n- The `query_side` closure in `test_generate_guide_persist_db_error_raises_500` correctly handles the multi-call `mock_db.query` dispatch needed to distinguish `ParentGuide` existence check from `Topic` lookup. Approach is sound.\n- All 8 original tests are preserved with correct coverage; the split adds no net ckend/tests/test_children_service_guides.py\n- **🟢 Low** Line 12: Docstring says \"service class renamed from ParentGuideService to ParentGuideService\" — should read \"renamed from ChildrenService to ParentGuideService\". Not a logic error but misleading for future readers. No backlog item filed (trivial fix the dev agent can inline on the next touching commit).\n\n### apps/backend/tests/test_children_service_db_errors.py\n- **🟢 Low** Lines 25–238: `TestChildrenServiceDBErrors` class intermixes `ChildrenService` tests (CRUD) and `ParentGuideService` tests (toggle_bookmark, guide persist) in a single class named after only one service. Tests pass and are structurally valid, but the class name implies exclusive `ChildrenService` coverage. Filed AWD-M-332.\n\n## What's Correct\n\n- All 5 router handlers correctly instantiate `ParentGuideService(db)` instead of `ChildrenService(db)`.\n- All mock-patch paths updated to `apps.backend.services.parent_guide_service.AwadeGPTService` in 4 test files — patches will actually intercept the correct import.\n- `ChildrenService` imports properly pruned: `ParentGuide`, `ValidationError`, `AwadeGPTService`, `ParentGuideResponse/ListResponse/AIContent` all removed, no dead imports remain.\n- `_build_guide_ai_payload` return type `-> ParentGuideRequest` is valid — `ParentGuideRequest` is a `TypedDict` so a plain dict literal satisfies it.\n- `toggle_bookmark` DB error handling (rollback + HTTP 500) and `_persist_guide` reload-after-write guard both transferred intact.\n- 1039 backend tests pass, 0 failures — all patch paths verified working.\n\n## Backlog Items Filed\n\n- AWD-M-331: `_verify_parent` / `_get_child_or_404` byte-identical in both `ChildrenService` and `ParentGuideService` — extract to shared helper module\n- AWD-M-332: `TestChildrenServiceDBErrors` class mixes tests for two different services — rename or split\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-27-f9260e9.md", "path": "../code-reviews/review-2026-07-27-f9260e9.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-27", "content": "# Code Review — 2026-07-27 · f9260e9\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 1 (requirements.txt — docs/agent-audit.log is infrastructure output, not application code)\n**Commits covered**: f9260e9\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\n### apps/backend/requirements.txt\nNo structural findings. The change is a pure dependency version bump:\n\n- `Pillow==12.2.0` → `12.3.0`: patch-series bump within the 12.x line. CVE annotations updated in inline comment (PYSEC-2026-2253/2254/2255/2256/2257 + PYSEC-2026-3451–3496). API compat note preserved. Correct and complete.\n- `setuptools==78.1.1` → `83.0.0`: CVE annotation updated (PYSEC-2026-3447 added alongside existing CVE-2025-47273 / CVE-2024-6345). Setuptools is a build/CI dep — no production import path. Correct.\n- `httplib2==0.22.0` → `0.32.0`: bare pin → annotated pin with PYSEC-2026-3444. Transitive dep of google-auth/OAuth libraries; not imported by application code directly. Correct.\n\nAll three bumps follow the existing comment convention (CVE IDs + AWD issue ref). No application code was modified. No test changes required for pure dependency bumps. No new coupling, duplication, or complexity introduced.\n\n## Backlog Items Filed\nNone\n\n## Notes\n- Change is minimal and targeted — exactly the right scope for a security patch.\n- All three bumps are within their respective minor/major series (Pillow 12.x patch, setuptools major bump confirmed safe, httplib2 minor series) — no breaking API surface affected.\n- The existing 1039 backend tests passing confirms no runtime regression.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "benchmark-2026-07-13.md", "path": "../performance/benchmark-2026-07-13.md", "category": "Performance", "agent": "performance-agent", "date": "2026-07-13", "content": "# Performance Report — 2026-07-13\n\n## Summary\n\n| Metric | Value | Threshold | Status |\n|--------|-------|-----------|--------|\n| API p50 (key endpoints) | unmeasured (8th consecutive week) | 300ms | ⚪ gap — see Findings |\n| Initial JS (entry + 5 modulepreloaded vendor chunks, gz) | 133,286 B (≈130.2 KB) | 300 KB | 🟢 |\n| Initial CSS (gz) | 10,897 B (≈10.6 KB) | — | 🟢 |\n| N+1 patterns on request path | 0 | 0 | 🟢 |\n| Backend deps (`requirements.txt`) | 33 | — | 🟢 flat |\n| Frontend deps (runtime / dev) | 9 / 22 | — | 🟢 flat |\n| Real user metrics (LCP/CLS/INP) | not available — no analytics MCP connected | — | ⚪ gap |\n\n## Regressions vs. Prior Week\nNone detected. Every measured metric is flat against `baseline.md` (2026-07-06):\n\n- Initial JS: 133,272 B → 133,286 B gz (+14 B, +0.01%) — well inside noise, not a regression.\n- Initial CSS: 10,897 B → 10,897 B gz — byte-identical.\n- Entry chunk `index-*.js`: 277,626 B raw / 56,144 B gz → 274,403 B raw / 56,158 B gz (−3,223 B raw, +14 B gz) — raw app code shrank slightly, gzip flat; noise, no regression.\n- `vendor-react` chunk: 142,321 B raw / 45,731 B gz — byte-identical to baseline.\n- `vendor-router` chunk: 22,635 B raw / 8,484 B gz — byte-identical to baseline.\n- `vendor-query` chunk: 35,670 B raw / 10,567 B gz — byte-identical to baseline.\n- `vendor-icons` chunk: 36,339 B raw / 11,167 B gz — byte-identical to baseline.\n- `vendor-auth` chunk: 2,555 B raw / 1,179 B gz — byte-identical to baseline.\n- Backend deps: 33 → 33 — unchanged.\n- Frontend deps: 9 runtime / 22 dev — unchanged.\n- N+1 sites: 0 → 0 (re-confirmed `curriculum_service.py:339-351` — two set-based queries, not a per-row loop; see Findings).\n\n## Findings\n\n### Build\nRan a clean `vite build --outDir dist_perf` (fresh outDir, not reusing the in-tree `dist/`) against the current `develop` source tree — built in 2.79s, no errors.\n\nInitial JS = entry chunk (`index-BZvoTHgB.js`) + the 5 chunks `index.html` marks `modulepreload`: `vendor-react`, `vendor-router`, `vendor-query`, `vendor-icons`, `vendor-auth`. Gzip sizes measured with `gzip -c` (level 6).\n\n| Chunk | Raw | Gzip |\n|---|---:|---:|\n| `index-BZvoTHgB.js` (entry) | 274,403 B | 56,158 B |\n| `vendor-react` | 142,321 B | 45,731 B |\n| `vendor-icons` | 36,339 B | 11,167 B |\n| `vendor-query` | 35,670 B | 10,567 B |\n| `vendor-router` | 22,635 B | 8,484 B |\n| `vendor-auth` | 2,555 B | 1,179 B |\n| **Initial JS total** | **513,923 B** | **133,286 B** |\n| `vendor-sentry` (not modulepreloaded, lazy) | 87 B | 127 B |\n| `index-*.css` | 68,154 B | 10,897 B |\n\n`vendor-sentry` (Sentry wired per AWD-H-01) is not `modulepreload`ed by `index.html`, so it is correctly excluded from the initial-JS figure — 87 B raw regardless.\n\nRoute-level code splitting: still none — all routes ship in the single entry chunk. Pre-existing observation (noted every prior week), a design choice rather than a regression; not filed.\n\n### N+1 scan\nHeuristic scan across `apps/backend/routers/` and `apps/backend/services/` (excluding tests) surfaced query calls near loops; the only request-path candidate remains `curriculum_service.py`. Inspected lines 339–351: `structure_ids` is built from a single `db.query(CurriculumStructure).filter(...).all()`, and `topics` is then fetched with a single `.filter(Topic.curriculum_structure_id.in_(structure_ids)).all()`. Two set-based queries, not a per-row loop — confirmed **not** an N+1, consistent with the AWD-M-165 aggregation fix. All other loop-adjacent query hits are in one-off data-population/migration scripts (`populate_*.py`) that run outside the request path.\n\n### API latency — 8th consecutive week unmeasured\nNo local server was reachable in the sandbox: ports 8000/8080/3000/5000 all returned no response, no `uvicorn`/`fastapi` process running, Docker absent from the sandbox. This is the 8th consecutive weekly run without a synthetic latency measurement (2026-05-11 → 2026-07-13). Already tracked by **M-318** (`docs/agentic/backlog.md`, stage=define) — decide whether to stand up a lightweight in-sandbox uvicorn instance or retire the synthetic check in favor of Sentry (wired AWD-H-01) as the real-user-latency source. Not re-filed.\n\n### Dependency audit\n`requirements.txt`: 33 packages, unchanged from baseline — no new heavy dependencies. Frontend: 9 runtime / 22 dev, unchanged. No single dependency over the 1 MB flag threshold introduced.\n\n### Build artifact note\nThe clean build for this run was written to `apps/frontend/dist_perf/`. The sandbox's mount permissions blocked deletion after measurement (same limitation as the `dist_new/` note in prior weeks). Unlike `dist/` and `dist_new/`, **`dist_perf/` is not currently in `apps/frontend/.gitignore`**, so it shows as an untracked directory. It contains only standard Vite build output — no source files were touched. Two low-effort remediations for Tolu / the dev-agent: (a) delete `apps/frontend/dist_perf/` manually, and (b) either add `dist_perf/` to `apps/frontend/.gitignore` or have this agent reuse the already-ignored `dist_new/` outDir next week. The dev-agent's `sync.sh` stages only specific paths (`docs/`, `scripts/`, `agent-permissions.json`), so this directory will not be committed by the normal sync flow.\n\n## Backlog Items Filed\nNone. All measured metrics are flat and within threshold. The one open gap (API latency) is already tracked by M-318.\n\n## Baseline Update\n`docs/performance/baseline.md` updated: bundle figures refreshed to today's clean-build measurement (flat vs. prior week), backend/frontend dependency counts confirmed unchanged (33 / 9 / 22), N+1 re-confirmed at 0, API latency gap counter advanced to 8 consecutive weeks.\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: performance-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-11-9da37bb.md", "path": "../code-reviews/review-2026-07-11-9da37bb.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-11", "content": "# Code Review — 2026-07-11 · 9da37bb\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 6\n**Commits covered**: 9da37bb (fix/security/AWD-M-326-active-user-check-reference-data)\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\nNo 🔴 or 🟠 findings.\n\n### Observation (🟢 Low — non-blocking)\n\n**`apps/backend/tests/test_suspension_reference_data_m326.py` — `_depends_on_active_user`**\n\n`isinstance(default, type(Depends(get_current_active_user)))` allocates a throwaway `Depends` instance on every call solely to obtain its class for `isinstance`. Equivalent and cleaner: `from fastapi.params import Depends as DependsClass; isinstance(default, DependsClass)`. Functionally identical; no behavioural impact.\n\n## Backlog Items Filed\n\nNone — observation is 🟢 Low, does not cross the 🟠 threshold for filing.\n\n## Notes\n\n- Change is minimal and correctly scoped. All 21 affected GET endpoints er`), so the parent user reaches the role check and correctly returns 403.\n\n## Backlog Items Filed\n\nNone — the 🟡 finding is already noted in the prior review at `docs/code-reviews/review-2026-07-08-880e27c.md` and does not yet meet the threshold for a new backlog row.\n\n## Notes\n\n- Prior review (same commit) reached the same verdict: ✅ Clean / 🟡 API Design asymmetry noted.\n- The core change is minimal and correct: 5 GET endpoints and 1 POST export endpoint tightened from `get_current_user` (any authenticated user) to `require_educator` / `require_admin_or_educator`. No logic changes.\n- The unused `get_current_user` import was cleanly removed — no dead imports remain.\n- The test suite (1009 backend / 314 frontend) is green; 6 new parametrized tests cover all touched routes.\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/private/agentic-operational/feedback-log.md` and improve future prompts.\n"}, {"title": "dep-security-2026-07-08.md", "path": "../audits/dep-security-2026-07-08.md", "category": "Dependency audit", "agent": "dependency-security-agent", "date": "2026-07-08", "content": "# Dependency Security Report — 2026-07-08\n\n## Summary\n| Severity | Count | Auto-patchable | Needs manual action |\n|----------|-------|----------------|---------------------|\n| 🔴 Critical | 0 | 0 | 0 |\n| 🟠 High | 0 | 0 | 0 |\n| 🟡 Medium | 2 | 0 | 2 |\n| 🟢 Low | 1 | 1 | 0 |\n\n`npm audit` (frontend, production): **0 vulnerabilities**.\n`pip-audit -r requirements.txt` (backend): **1 known vulnerability** (weasyprint, downgraded to Medium — see below).\n\n## Vulnerability Details\n\n### weasyprint@68.0 — CVE-2026-49452 (GHSA-jhhc-3hcp-qhm5) — 🟡 Medium (baseline 🟠 High)\n- **Description**: CSS injection via the unescaped `background` HTML attribute when `presentational_hints=True` is passed to `HTML()`/`CSS()`. Injected CSS can trigger a `url()` fetch, enabling SSRF (PoC in the advisory targets `http://169.254.169.254/latest/meta-data/`, i.e. cloud instance metadata).\n- **Affected path**: direct dependency (`apps/backend/requirements.txt`).\n- **In call path**: **no**. `apps/backend/services/pdf_service.py:81` and `:483` both call `HTML(string=html_content)` with no `presentational_hints` argument — the WeasyPrint default is `False`. Confirmed via `grep -rn \"presentational_hints\"` across the repo — zero matches. Per triage rules, downgraded one level (High → Medium) since the vulnerable code path is never exercised.\n- **Fix**: no fix version published (`pip-audit`/OSV `fix_versions: []`). Latest PyPI release is 69.0, but not confirmed to contain a fix — do not upgrade purely on the assumption it's patched.\n- **Mitigation documented**: never introduce `presentational_hints=True` in `pdf_service.py`; a regression test asserting this should be added. Re-check this CVE on the next weekly scan for a published fix.\n- **Backlog item filed**: M-323 (stage=ready — action is to add the guard/test now; upgrade once a real fix lands)\n\n## License Issues\nNone found — checked `apps/frontend` production deps via `license-checker` and `apps/backend` deps via `pip-licenses`. No GPL/AGPL/LGPL/SSPL/CC-BY-SA licenses in the production dependency set.\n\n## Stale Dependencies (2+ major versions behind)\n\n| Package | Current | Latest | Where used | Severity |\n|---------|---------|--------|------------|----------|\n| redis | 5.2.1 | 8.0.1 | `apps/backend` — AI content cache (`packages/ai/cache.py`), rate-limiter backing store | 🟡 Medium — production dep, 3 majors behind; jump likely has breaking client API changes, needs verification before bumping (not auto-patchable) |\n| pytest-cov | 4.1.0 | 7.1.0 | `apps/backend` — coverage reporting, devDependency only | 🟢 Low — never reaches production; auto-patchable |\n\nFrontend `npm outdated` flagged 10 packages 2+ majors behind, but all are devDependencies (`@typescript-eslint/*`, `eslint`, `jsdom`, `@testing-library/react`, `@vitejs/plugin-react`, `lint-staged`, `@rollup/rollup-linux-x64-*`) — no production-facing risk, not filed individually this cycle (no CVEs attached; routine tooling drift).\n\n## SBOM Changes vs. Prior Week (`sbom-2026-07-01.md`)\n**New packages**: None.\n**Removed packages**: None.\n**Version changes**: `react-icons` 4.12.0 → 5.7.0 — this is AWD-L-38, already resolved and merged by dev-agent on 2026-07-05 (commit 92ddd4d, merge 5f6929b) before this scan ran; not a new finding.\n\n## Backlog Items Filed\n- **M-323** — DepSec: weasyprint@68.0 CVE-2026-49452 (CSS injection / SSRF-adjacent), not in call path, mitigation + regression test needed | Stage: ready\n- **M-322** — DepSec/Staleness: redis@5.2.1 → 8.0.1, 3 majors behind, needs breaking-change review before bump | Stage: define\n- **L-86** — DepSec/Staleness: pytest-cov@4.1.0 → 7.1.0, devDependency only, auto-patchable | Stage: ready\n\n## SBOM Snapshot\n`docs/security/sbom-2026-07-08.md`\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: dependency-security-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-08-880e27c.md", "path": "../code-reviews/review-2026-07-08-880e27c.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-08", "content": "# Code Review — 2026-07-08 · 880e27c\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2\n**Commits covered**: 880e27c\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 1 | 🟡 |\n\n## Findings\n\n### apps/backend/routers/lesson_plans.py\n\n- **🟡 Medium** Lines 129–158 vs 96–127: ADMIN role can `update_lesson_plan` / `delete_lesson_plan` (via `require_admin_or_educator`) but can no longer `get_lesson_plans` / `get_lesson_plan` (now `require_educator`-only). This asymmetry — write access without read access for the same resource type — may confuse a future maintainer or block a hypothetical admin audit flow. In practice admin users use separate `/admin/` routes and the lesson-plan service already scopes reads by `user_id`, so no operational breakage today.\n  Fix: document the intent explicitly with an inline comment on the GET handlers (e.g., `# ADMIN uses /admin/ routes — educator-only here`) or, if admin read is ever needed, add a separate `GET /api/admin/lesson-plans` endpoint rather than loosening this one.\n\n### apps/backend/tests/test_lesson_plans_router.py\n\n- **🟢 Low** Line 266: `parent_user` fixture is placed mid-file after `TestExportLessonResource`, while the other three fixtures (`educator`, `other_educator`, `admin_user`, `super_admin_user`, `resource`) are grouped at the top. Purely cosmetic — no functional impact.\n  Fix: move `parent_user` fixture to the fixture block near the top of the file on the next touch.\n\n## Backlog Items Filed\n\nNone — the 🟡 finding is advisory; the functional fix is complete and correct. The asymmetry is pre-existing intent (admin routes are separate); a comment clarification does not warrant a backlog item.\n\n## Notes\n\n- The core fix is precisely scoped: six dependency swaps, one import removal, six new tests. No collateral changes.\n- `require_educator` correctly blocks PARENT (and ADMIN/SUPER_ADMIN) on all five GET endpoints; `require_admin_or_educator` on export preserves the ADMIN moderation bypass tested by `test_admin_can_export_any_resource` and `test_super_admin_can_export_any_resource`.\n- The dependency override pattern (`app.dependency_overrides[get_current_user]`) continues to propagate correctly through the `require_educator → check_role → get_current_active_user → get_current_user` chain — confirmed by 28/28 tests passing.\n- Two pre-existing unused imports (`Query`, `datetime`) in the router were not introduced by this PR and are out of scope.\n\n---\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-07-a519d45.md", "path": "../code-reviews/review-2026-07-07-a519d45.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-07", "content": "# Code Review — 2026-07-07 · a519d45\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2 (source), 1 (test)\n**Commits covered**: a519d45\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 1 | 🟢 |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\n### apps/frontend/src/pages/SettingsPage.components.tsx\n\n- **🟢 Low** Lines 299, 348: `profileEmail || user?.email` is now a redundant double-dereference. Since `profileEmail = user?.email ?? null`, both fallback expressions collapse to `user?.email`. Harmless and defensive — not blocking.\n\n## Backlog Items Filed\n\nNone — finding is Low/cosmetic; not worth a backlog row for a two-line redundancy that carries no correctness risk.\n\n## Notes\n\nThe change is exactly right. `SecurityTab` does not own the user data — it consumes the auth context. Lifting email from `useAuth()` instead of firing a second `getCurrentUser()` call eliminates the redundant network request, removes the now-unnecessary `useState` + `useEffect` pair (reducing component complexity), and removes the swallowed `.catch(() => {})` that was a silent failure point. The new regression test (`switching to SecurityTab does not fire a second getCurrentUser call`) directly verifies the behaviour-level contract rather than the implementation detail, which is the correct level of abstraction for this kind of fix.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "access-review-2026-07-07.md", "path": "../audits/access-review-2026-07-07.md", "category": "Access review", "agent": "access-review-agent", "date": "2026-07-07", "content": "# Access Review — 2026-07-07\n\n> Agent: access-review-agent · Run type: scheduled · Stack: FastAPI + React/TS, JWT (PyJWT) + Google OAuth, PostgreSQL, Render + Vercel\n> Previous run: 2026-06-02 (filed AWD-M-205, AWD-M-206; carried forward AWD-H-73). Idempotency check (`./scripts/idempotency-check.sh access-review-agent 43200`) returned exit 0 (35 days since last heartbeat) — proceeding as the legitimate periodic run.\n\n## Summary\n\n| Area | Findings | Worst Severity |\n|------|----------|----------------|\n| Route auth coverage | 103 routes checked, 0 gaps | 🟢 |\n| IDOR risk | 0 findings — ownership scoping consistent | 🟢 |\n| Agent permission manifest | 1 corrected finding (source-of-truth), M-205/M-206 still open and now larger in scope | 🟡 |\n| API key rotation | AWD-H-73 still open, unresolved 63 days | 🟠 (escalating — see below) |\n| Session / token security | 0 findings | 🟢 |\n| Service-to-service auth | N/A — single backend service | 🟢 |\n\nApplication-layer access control remains clean — no regressions since 2026-06-02 in route auth, IDOR scoping, or token handling. The open items are all governance/process gaps carried from the last review, and one of them (AWD-H-73, key rotation) has now sat unactioned through the stated June 2026 public launch window. No new Critical or High findings this run; one new correction to an existing Medium finding.\n\n---\n\n## Detailed Findings\n\n### Route auth coverage — 🟢 Clean (103 routes, unchanged count)\n\n| Router | Routes | Gating |\n|--------|--------|--------|\n| `admin.py` | 12 | Router-level `dependencies=[Depends(require_admin)]` on all routes |\n| `children.py` | 13 | `require_parent` on all 13 |\n| `lesson_plans.py` | 10 | `get_current_user` / `require_educator` / `require_admin_or_educator` per route, no gaps |\n| `curriculum.py` | 18 | `get_current_user` (read) / `require_admin` (write) on all |\n| `curriculum_structure.py` | 5 | same pattern, gated on all |\n| `users.py` | 8 | `get_current_active_user` / `require_admin` / `require_admin_or_educator`, ownership enforced in service layer |\n| `contexts.py` | 7 | `require_admin_or_educator` on all |\n| `country.py` / `grade_level.py` / `subject.py` | 22 | `get_current_user` (read) / `require_admin` (write) |\n| `auth.py` | 8 | `/me` requires `get_current_user`; the 7 public routes (`/signup`, `/login`, `/google`, `/refresh`, `/logout`, `/forgot-password`, `/reset-password`) are public by design |\n\nNo unauthenticated route handles user data. No admin endpoint lacks a role gate. **No findings** — same clean posture as 2026-06-02.\n\n### IDOR — 🟢 Clean\n\nSpot-checked the routes with the widest blast radius (`users.py:/{user_id}`, `/{user_id}/profile`, `/{user_id}/profile` PUT — all gated by `require_admin_or_educator`, i.e. any educator could theoretically pass any `user_id`):\n\n- `UserService.get_user(user_id, current_user)` docstring: \"Users may only retrieve their own record. ADMIN and SUPER_ADMIN may retrieve any record\" — ownership enforced inside the service, not just at the route.\n- `UserService.get_user_profile` / `update_user_profile` call `self._assert_user_access(current_user, user_id)` before acting.\n- `children_service._get_child_or_404` scopes by `ChildProfile.parent_id == user.user_id`.\n- `lesson_plan_service` filters by `LessonPlan.user_id == current_user.user_id`.\n\n**No findings.**\n\n### Agent permission manifest — 🟡 Correction + scope growth on existing open items\n\n**Correction to AWD-M-206's premise.** The 2026-06-02 review stated the \"real\" manifest lives at `docs/private/agent-permissions.json` and that the root-level `agent-permissions.json` reads path was wrong. This run found the opposite is true:\n\n- `agent-permissions.json` (repo root) is **git-tracked** — `git log` shows 5 commits against it, most recently `93138cd` (AWD-M-308, 2026-07-0x) and it is kept current (e.g. `docs/performance/**` and `docs/tech-debt/**` were added for performance-agent/tech-debt-agent in recent commits).\n- `docs/private/agent-permissions.json` is **untracked** (matched by `.gitignore:101`, confirmed via `git ls-files` returning nothing) and has **zero commits against it** — it is a stale, diverged local duplicate, not a second source of truth.\n- `scripts/check-permissions.sh` — the actual enforcement script referenced throughout the ruleset — defaults its manifest path to `agent-permissions.json` (repo root), confirming the root file is the operative one.\n\nSo AWD-M-206 is still valid, but its diagnosis needs updating: the fix is not \"point reads at `docs/private/agent-permissions.json`\" — it's the reverse. `access-review-agent/SKILL.md` should read the **root** `agent-permissions.json` (which it can already do — the file is not `docs/private/**` and is not forbidden), and the stale `docs/private/agent-permissions.json` duplicate should be deleted or explicitly documented as dead so it stops being cited as authoritative. I've appended this correction to the existing AWD-M-206 entry rather than filing a new ID (see Backlog Items Filed).\n\n**New self-referential gap found this run (folded into AWD-M-206, not filed separately):** `access-review-agent`'s own manifest `writes` list is `[\"docs/agentic/backlog.md\", \".agent-health/access-review-agent.last-run\"]`. It does **not** include `docs/audits/**` (where this agent's SKILL.md instructs it to write its report) or `docs/agentic/agent-run-log.jsonl` (which the scheduled-task wrapper instructs it to append to on every run, including this one). If `check-permissions.sh` were ever wired into this agent's write path as a pre-flight gate, both actions would be denied under its own declared scope.\n\n**AWD-M-205 (live agents absent from manifest) — still open, scope has grown.** The manifest still declares the same 14 agents. Cross-referencing `.claude/skills/` (33 skills now, up from 24 at last review) against fresh `.agent-health/*.last-run` timestamps, the following agents have run **since** the 2026-06-02 review and remain fully ungoverned by the manifest: `analytics-agent` (2026-07-06), `sprint-planning` (2026-07-06), `support-agent` (2026-07-02), `seo-agent` (2026-07-03), `daily-health-check` (2026-07-03), `weekend-ops` (2026-07-04). `growth-agent` (last run 2026-06-05) and `improvement-agent` (last run 2026-06-05) have gone quiet for ~32 days and may no longer need urgent manifest coverage if they've been deprecated — worth confirming with Tolu rather than assuming. Not re-filed as a new ID; the existing AWD-M-205 acceptance criteria already cover \"add manifest entries for every actively-running agent,\" so this run's addendum just refreshes the list of who that currently means.\n\nHeartbeat-path check: all 14 manifest agents still include `.agent-health/<name>.last-run` in their `writes` list. ✅\nWrite-conflict check: no new conflicts beyond the two previously-documented, accepted exceptions (`docs/agentic/backlog.md` append-style across most agents; `morning-brief.md` last-write-wins between `nightly-monitor` and `code-review-agent`).\nJSON validity: `python3 -m json.tool agent-permissions.json` → ✅ valid.\n\n### API key rotation — 🟠 Still open, now overdue by a wider margin\n\nAWD-H-73 was filed 2026-05-05 and remains `stage=define` — **63 days unactioned**, spanning the stated \"Parent pivot public launch — June 2026\" window (`project-config.md` now shows `STAGE: launched`). Verification this run, unchanged from last time:\n- `docs/agentic/key-rotation-log.md` — still not created.\n- No `# Last rotated: YYYY-MM-DD` comments in `.env.example` / `env.example` / `env.production.template` / `env.test.template`.\n- Keys affected: `OPENAI_API_KEY`, `GEMINI_API_KEY`, `GOOGLE_API_KEY`/`GOOGLE_CLIENT_ID`, `JWT_SECRET_KEY`, `SMTP_PASSWORD`.\n\nNot re-filed (duplicate of AWD-H-73). Flagging severity escalation in the recommendation below: this is the only access-control item that has now gone two full review cycles without any action, and it covers a launched product's credentials.\n\nPositive, unchanged: `apps/backend/dependencies.py` still correctly raises `RuntimeError` if `JWT_SECRET_KEY` is unset outside dev environments — no forged-token acceptance risk in production.\n\n### Session / token security — 🟢 Clean\n\n- Access tokens: HttpOnly cookies (`apps/backend/routers/auth.py`); grep for `localStorage`/`sessionStorage` token usage across `apps/frontend/src/` returned nothing.\n- Access-token expiry: `JWT_EXPIRES_MINUTES` defaults to 60 minutes (`token_service.py`) — well under the 24h threshold.\n- Refresh token: unique `jti` per token, rotated on refresh (`refresh_access_token`), blacklisted via Redis on logout (`blacklist_refresh_token`).\n\n**No findings.**\n\n### Service-to-service auth — 🟢 N/A\n\nSingle backend service. Outbound calls are limited to Redis (`localhost`, internal — `redis_client.py`, `worker.py`) and Google's OAuth verification endpoint (HTTPS). No hard-coded service tokens found; no `SERVICE_SECRET`/`internalApi` patterns present in `apps/backend/` or `apps/frontend/src/`.\n\n---\n\n## Agent Permissions Summary\n\n| Agent | Write paths | Assessment |\n|-------|-------------|------------|\n| dev-agent | `apps/**`, `packages/**`, ci.yml, env templates, openapi.json, alembic, backlog, dev-log, heartbeat | ✅ Broad but matches lead-dev/git-gateway role |\n| qa-agent | backlog, qa-log, heartbeat | ✅ Tight |\n| security-agent | backlog, heartbeat | ✅ Tight |\n| nightly-monitor | morning-brief, heartbeat | ✅ Tight |\n| weekly-review | sprint-plans, heartbeat | ✅ Tight |\n| code-review-agent | backlog, code-reviews/**, morning-brief, heartbeat | ✅ Unchanged — shared morning-brief write remains a documented, low-risk exception |\n| compliance-agent | privacy-policy, terms-of-service, backlog, heartbeat | ✅ Appropriate |\n| architecture-agent | architecture/*.md, backlog, heartbeat | ✅ Tight |\n| performance-agent | backlog, `docs/performance/**`, feedback-log, agent-audit.log, agent-run-log.jsonl, heartbeat | ⚠️ Only agent with explicit write grants to the three shared logging files (feedback-log.md, agent-audit.log, agent-run-log.jsonl); every other manifest agent lacks these despite CLAUDE.md's per-agent logging conventions applying broadly — inconsistent, not dangerous. Worth a follow-up pass to standardize (not filed this run — recommend folding into AWD-M-205's remediation since it's the same \"manifest doesn't reflect actual obligations\" root cause). |\n| dependency-security-agent | requirements.txt, package.json, backlog, heartbeat | ✅ Appropriate |\n| access-review-agent | backlog, heartbeat | ⚠️ Missing `docs/audits/**` and `docs/agentic/agent-run-log.jsonl` — see AWD-M-206 update above |\n| tech-debt-agent | backlog, `docs/tech-debt/**`, heartbeat | ✅ Tight |\n| marketing-agent | docs/public/**, marketing-brief, heartbeat (forbids apps/**) | ✅ Tight |\n| finance-agent | backlog, heartbeat (forbids apps/**) | ✅ Tight |\n| analytics-agent, sprint-planning, support-agent, seo-agent, daily-health-check, weekend-ops | — | ⚠️ Actively running (fresh heartbeats within the last 5 days) but **absent from manifest** (AWD-M-205) |\n| growth-agent, improvement-agent | — | ⚠️ Absent from manifest; heartbeats stale (~32 days) — confirm with Tolu whether still active before adding scope |\n| design-agent, discovery-agent, gtm-agent, content-agent, devops-agent, incident-response-agent, legal-agent, ops-agent, pm-agent, onboarding-agent, dashboard-refresh | — | ⚠️ Skills on disk, no heartbeat found — likely on-demand only; AWD-M-205 asks that this be confirmed and either scoped or documented as on-demand |\n\n## API Key Rotation Status\n\n| Key type | Last rotated | Interval | Status |\n|----------|-------------|----------|--------|\n| OPENAI_API_KEY | unknown | 180 days | 🟠 tracked under AWD-H-73 — 63 days unresolved |\n| GEMINI_API_KEY | unknown | 180 days | 🟠 tracked under AWD-H-73 |\n| GOOGLE_API_KEY / CLIENT_ID | unknown | 180 days | 🟠 tracked under AWD-H-73 |\n| JWT_SECRET_KEY | unknown | 180 days | ⚠️ no rotation log; dev-fallback guard still in place ✅ |\n| SMTP_PASSWORD | unknown | 90 days | ⚠️ no rotation log |\n| SENTRY_DSN | n/a (DSN, not a secret key) | — | ✅ |\n\n## Backlog Items Filed\n\n- **None new.** This run corrects and extends two existing open items rather than filing duplicates, per the \"don't re-file an issue that already has an open row\" rule:\n  - **AWD-M-206** — appended a correction: the canonical manifest is the git-tracked root `agent-permissions.json`, not `docs/private/agent-permissions.json` (which is untracked, has zero commits, and is not read by `check-permissions.sh`'s default path). Also appended the newly-found gap: access-review-agent's own manifest lacks write scope for `docs/audits/**` and `docs/agentic/agent-run-log.jsonl`, both of which its own SKILL.md and scheduled-task wrapper require it to write to.\n  - **AWD-M-205** — appended the current list of actively-running, manifest-absent agents (`analytics-agent`, `sprint-planning`, `support-agent`, `seo-agent`, `daily-health-check`, `weekend-ops`), since the original finding's example list (`growth-agent`, `sprint-planning`) is now partly stale.\n- **Not re-filed:** AWD-H-73 (key rotation — still open, now flagged as urgent given launch has occurred).\n\n## Recommended Next Actions\n\n1. **Action AWD-H-73 now, not on the next cycle.** This is the only High-severity item, it has been open for 63 days across two review cycles, and the product has since launched publicly with credentials of unknown rotation age. Rotate OPENAI/GEMINI/GOOGLE keys, add `# Last rotated:` comments to the env templates, and create `docs/agentic/key-rotation-log.md`.\n2. **Close out AWD-M-205 and AWD-M-206 together** — both are manifest-hygiene issues and the fix is largely mechanical: add the ~9 missing live/likely-live agents to `agent-permissions.json` (root) with least-privilege scopes, add `docs/audits/**` and `docs/agentic/agent-run-log.jsonl` to access-review-agent's own writes, and delete or clearly mark `docs/private/agent-permissions.json` as a non-authoritative stale copy so it stops misleading future reviews (including this one, initially).\n3. **Decide whether growth-agent and improvement-agent are still active.** Both have gone ~32 days without a heartbeat — either they should be re-scheduled/investigated (nightly-monitor's health-check territory) or explicitly retired before being added to the permission manifest, so the manifest doesn't end up governing dead skills.\n\n---\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: access-review-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "benchmark-2026-07-06.md", "path": "../performance/benchmark-2026-07-06.md", "category": "Performance", "agent": "performance-agent", "date": "2026-07-06", "content": "# Performance Report — 2026-07-06\n\n## Note on last week's run\nThe 2026-06-29 run measured clean benchmarks but was blocked from writing to `docs/performance/` by a stale write-permission manifest (filed as `M-308`, resolved 2026-06-30, commit 93138cd). No `benchmark-2026-06-29.md` exists as a result. This report picks the comparison baseline back up from `benchmark-2026-06-22.md` / `docs/performance/baseline.md` (14 days prior) and folds in the 06-29 numbers for continuity — they were flat with today's, so no data is lost.\n\n## Summary\n\n| Metric | Value | Threshold | Status |\n|--------|-------|-----------|--------|\n| API p50 (key endpoints) | unmeasured (7th consecutive week) | 300ms | ⚪ gap — see Findings |\n| Initial JS (entry + 5 modulepreloaded vendor chunks, gz) | 133,272 B (≈130.2 KB) | 300 KB | 🟢 |\n| Initial CSS (gz) | 10,897 B (≈10.6 KB) | — | 🟢 |\n| N+1 patterns on request path | 0 | 0 | 🟢 |\n| Backend deps (`requirements.txt`) | 33 | — | 🟢 flat |\n| Frontend deps (runtime / dev) | 9 / 22 | — | 🟢 flat |\n| Real user metrics (LCP/CLS/INP) | not available — no analytics MCP connected | — | ⚪ gap |\n\n## Regressions vs. Prior Week\nNone detected. Every measured metric is flat against `baseline.md` (2026-06-22):\n- Initial JS: 132,927 B → 133,272 B gz (+345 B, +0.26%) — well inside noise, not a regression.\n- Initial CSS: 10,897 B → 10,897 B gz — unchanged.\n- `vendor-react` chunk: 142,321 B raw / 45,731 B gz — byte-identical to baseline.\n- `vendor-router` chunk: 22,635 B raw / 8,484 B gz — byte-identical to baseline.\n- Backend deps: 33 → 33 — unchanged.\n- Frontend deps: 9 runtime / 22 dev — unchanged.\n- N+1 sites: 0 → 0 (re-confirmed `curriculum_service.py:340-350` — the list comprehension at line 341 iterates an already-materialized Python list, not a per-row query; AWD-M-165's aggregated-COUNT fix is intact).\n\n## Findings\n\n### Build\nRan a clean `vite build --outDir dist_new` (fresh outDir, not reusing the in-tree `dist/`) against the current `develop` source tree — 808 modules transformed, built in 3.00s, no errors.\n\nInitial JS = entry chunk (`index-B7j5WbC3.js`) + the 5 chunks `index.html` marks `modulepreload`: `vendor-react`, `vendor-router`, `vendor-query`, `vendor-icons`, `vendor-auth`.\n\n| Chunk | Raw | Gzip |\n|---|---:|---:|\n| `index-B7j5WbC3.js` (entry) | 277,626 B | 56,144 B |\n| `vendor-react` | 142,321 B | 45,731 B |\n| `vendor-icons` | 36,339 B | 11,167 B |\n| `vendor-query` | 35,670 B | 10,567 B |\n| `vendor-router` | 22,635 B | 8,484 B |\n| `vendor-auth` | 2,555 B | 1,179 B |\n| **Initial JS total** | **517,146 B** | **133,272 B** |\n| `vendor-sentry` (not modulepreloaded, lazy) | 87 B | 127 B |\n| `index-*.css` | 68,154 B | 10,897 B |\n\nA `vendor-sentry` chunk now exists (Sentry wired per AWD-H-01) but is not `modulepreload`ed by `index.html`, so it is correctly excluded from the initial-JS figure — negligible size regardless (87 B raw).\n\nRoute-level code splitting: still none — all routes ship in the single entry chunk. This is a pre-existing observation (noted every prior week), not a new defect, and not filed as it's a design choice rather than a regression.\n\n### N+1 scan\nHeuristic scan (`for ... in` followed by `.query(`/`.filter(`/`session.execute` within 8 lines) across `apps/backend/` (excluding `tests/`) returned 18 hits. 17 of the 18 are in one-off data-population/migration scripts (`populate_database.py`, `populate_from_export.py`, `populate_nerdc_curriculum.py`, `populate_jss1_math.py`, `test_database.py`) that run outside the request path — not user-facing N+1 risk. The remaining hit, `curriculum_service.py:341`, is a Python list comprehension over an already-fetched SQLAlchemy result set (`self.db.query(CurriculumStructure)...all()` executed once), not a per-iteration query — confirmed not an N+1, consistent with the AWD-M-165 fix.\n\n### API latency — 7th consecutive week unmeasured\nNo local server was reachable in the sandbox (checked ports 8000/8080/3000/5000, no `uvicorn`/`fastapi` process running, Docker not installed in this sandbox). This is the 7th consecutive weekly run without a synthetic latency measurement (2026-05-11 → 2026-07-06). Filed `M-318` to force a decision: either invest in a lightweight in-sandbox server for this check, or retire the synthetic check in favor of Sentry (wired per AWD-H-01) as the real-latency source.\n\n### Dependency audit\n`requirements.txt`: 33 packages, unchanged from baseline — no new heavy dependencies. Frontend: 9 runtime / 22 dev, unchanged.\n\n### Build artifact note\nThe clean build for this run was written to `apps/frontend/dist_new/` (kept isolated from the in-tree `dist/` used by other agents). It could not be removed after measurement — the sandbox's mount permissions blocked deletion of files under the connected folder. It is a standard Vite build-output directory and should already be excluded by `apps/frontend/.gitignore`; no source files were touched. Flagging for Tolu to delete manually if desired.\n\n## Backlog Items Filed\n- `M-318` (stage=define) — API latency benchmark unmeasured for 7 consecutive weeks; decide on a fix or a replacement metric.\n\n## Baseline Update\n`docs/performance/baseline.md` updated: bundle figures refreshed to today's clean-build measurement (flat vs. prior), backend/frontend dependency counts confirmed unchanged, N+1 re-confirmed at 0, API latency gap counter advanced to 7 consecutive weeks.\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: performance-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "compliance-audit-2026-07-06.md", "path": "../legal/compliance-audit-2026-07-06.md", "category": "Compliance / legal", "agent": "compliance-agent", "date": "2026-07-06", "content": "# Compliance Audit — 2026-07-06\n\n> Run by: compliance-agent (monthly, first Monday) · Second recorded run for this repo. Prior run: `docs/legal/compliance-audit-2026-06-01.md`.\n> Scope: engineering & data-handling review against regulatory checklists. **This is not legal advice** — material findings require human legal review.\n\n## Regulations in Scope\n\nUnchanged from last run — derived from `project-config.md §12`:\n\n| Regulation | In scope? | Why |\n|-----------|-----------|-----|\n| GDPR (EU/EEA) | ✅ Yes | European parents/educators possible; `GDPR_REQUIRED: yes` |\n| CCPA / CPRA | ⚠️ Partial | Possible CA users; pre-revenue and < $25M, most thresholds not met — treated alongside GDPR rights |\n| COPPA (US) | ✅ Yes | `child_profiles` stores minors' data; `COPPA_REQUIRED: yes` |\n| NDPR (Nigeria) / POPIA (South Africa) | ✅ Yes | Primary user base is African; cross-border transfer to US infrastructure |\n| EU AI Act | ✅ Yes | AI-generated guides/lessons offered to EU-possible users |\n| PCI-DSS | ❌ No | No payment processing yet |\n| HIPAA | ❌ No | No US health data |\n\n## Summary\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| PII inventory | 9 fields catalogued — unchanged, no new PII fields since last audit | — |\n| Right to deletion | ✅ `delete_my_account` + cascade (`apps/backend/routers/users.py:61`) | 🟢 |\n| Right to portability | ✅ `/api/users/me/data-export` (`apps/backend/routers/users.py:38`) | 🟢 |\n| Cookie/tracking consent | ✅ No tracking scripts found (mixpanel/posthog/amplitude/gtag/fbq) — cookieless posture unchanged | 🟢 |\n| Privacy policy | ✅ Complete, unchanged since 4 May 2026 — no drift from code | 🟢 |\n| Data retention policy | ⚠️ Same enforcement gap as last audit — **M-204 still open** | 🟡 Medium |\n| PII in logs | ✅ Clean — password-reset flow logs `user_id` only, explicit comment forbids logging raw token (`auth_service.py:441-443`) | 🟢 |\n| Third-party disclosure | ✅ Sentry wired with `send_default_pii: False` confirmed both backend (test-covered) and frontend (`main.tsx:30`) | 🟢 |\n| COPPA consent | ✅ `ParentalConsent` model + `_require_consent()` enforced server-side, unchanged | 🟢 |\n| AI transparency | ✅ Disclaimer page present; AI output now hard-fails (502) on safety-validation failure (`AWD-H-134`) rather than passing through — improvement since last audit | 🟢 |\n\n**Overall:** Compliance posture unchanged to improved since 2026-06-01. The one open Medium finding (M-204, retention enforcement) has **not been fixed** in the intervening 5 weeks — still `stage=discover`. No new Critical or High compliance findings. Several unrelated security hardening commits landed in this window (rate limiting, timing-oracle fix, prompt-injection sanitisation) that indirectly strengthen the LLM Top 10 / AI Act posture — noted below, not filed as new compliance items since they were filed and tracked under the security-agent's own IDs.\n\n## Detailed Findings\n\n### 🟡 M-204 — Admin audit log 1-year retention still not enforced (recurring, unresolved)\n\n- **Regulation:** GDPR Art. 5(1)(e) (storage limitation); POPIA §14.\n- **Status:** Still open at `stage=discover` in `docs/agentic/backlog.md:552`. Re-confirmed this run: `grep` for `APScheduler|celery|retention|purge|cleanup` across `apps/backend` (excluding tests) still returns no purge routine for `admin_audit_logs`.\n- **No change from last audit** — filing already exists, not re-filed (per backlog-filing rule: don't re-file an existing open issue). Flagging that it has now persisted for 5+ weeks without triage.\n- **Recommendation:** Tolu should prioritise triage — a stated policy commitment (privacy policy §6) that the code does not keep is a compounding legal-exposure item, not a cosmetic one.\n\n### Notes / observations (no finding filed — improvements since last audit)\n\n- **AWD-H-134** (`fix(security): raise 502 on AI safety validation failure in generate_guide`) — the AI output-validation path (`packages/ai/gpt_service.py`, `_check_content_safety`) now blocks on detected PII/injection-marker/harmful-content in AI output rather than only logging. This directly strengthens OWASP LLM Top 10 item #2 (insecure output handling) — worth a one-line mention next policy revision, not a new backlog item.\n- **AWD-M-198 / M-263 / M-266 / M-268 / M-272 / H-128** — a cluster of prompt-injection sanitisation fixes landed in `packages/ai/prompts.py`-adjacent code between June 1 and now (delimiter-tag stripping, per-field sanitisation, case-insensitive matching). These reduce OWASP LLM #1 (prompt injection) exposure. No compliance gap — noting for the audit trail since they touch AI-Act-relevant code.\n- **AWD-H-133 / M-307** — account-enumeration and timing-oracle fixes in auth flow. Security hardening, not privacy-regulation scope, but relevant to GDPR Art. 32 (security of processing) — no separate finding needed, already tracked as security items.\n- **Sentry `send_default_pii: False`** is now explicitly test-covered (`apps/backend/tests/test_sentry_init.py`) — confirms the third-party-sharing disclosure in the privacy policy (§4c) matches actual Sentry configuration, not just intent.\n\n## Backlog Items Filed\n\n- None. M-204 remains the sole open compliance finding; it already exists in `docs/agentic/backlog.md` and was not re-filed.\n\n## Data Inventory Summary\n\nNo changes to the PII inventory since 2026-06-01 — no new tables or PII-bearing columns were added to `apps/backend/models.py` in this window (confirmed via `git log --since=2026-06-01 -p -- apps/backend/models.py`, no new `class` additions).\n\n| PII field | Storage location | Encrypted at rest | Retention | Deletion mechanism |\n|-----------|------------------|-------------------|-----------|--------------------|\n| Email | `users.email` | ✅ AES-256 | Account lifetime + 30d | `delete_my_account` cascade |\n| Full name | `users.full_name` | ✅ | Account lifetime + 30d | cascade |\n| Password (bcrypt hash) | `users.password_hash` | ✅ (hashed) | Account lifetime | cascade; excluded from export |\n| Phone (optional) | `users.phone` | ✅ | Account lifetime + 30d | cascade |\n| Google account ID | `users` (OAuth) | ✅ | Account lifetime | cascade |\n| Child first name | `child_profiles` | ✅ | Parent account lifetime + 30d | cascade via `User.children` |\n| Child country/grade/subjects | `child_profiles` | ✅ | Parent account lifetime | cascade |\n| Consent IP address | `parental_consents.ip_address` | ✅ | Tied to parent (CASCADE) | cascade on user delete |\n| Admin actor IP address | `admin_audit_logs.ip_address` | ✅ | **Stated 1 yr — still not enforced (M-204)** | none (accumulates) |\n\nTransport: TLS 1.2+ everywhere. Auth tokens: HttpOnly/Secure/SameSite=Lax cookies, not localStorage. AI processing: only grade/subject/topic sent to OpenAI — no names (unchanged, re-verified `packages/ai/gpt_service.py` / `prompts.py`).\n\n## Recommended Privacy Policy Updates\n\nNo structural gaps — policy unchanged and still accurate against code, with one exception:\n\n1. **M-204 dependent**: once the retention purge is implemented, no policy text change needed (policy already states 1 year correctly).\n2. Before EU launch: still recommend a short Legitimate Interest Assessment (LIA) for Vercel Analytics, per last audit — not yet produced.\n3. Consider mirroring the in-product AI-generated-content disclosure (Disclaimer page) as an explicit line in the policy body ahead of full EU AI Act transparency obligations taking effect — still outstanding from last audit, not urgent.\n\n---\n\n*This audit assesses engineering implementation against regulatory checklists. It cannot determine legal compliance. The recurring M-204 finding (now 5+ weeks unresolved) is the one item warranting Tolu's attention before the next audit cycle.*\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: compliance-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-05-AWD-L-85.md", "path": "../code-reviews/review-2026-07-05-AWD-L-85.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-05", "content": "# Code Review — 2026-07-05 · 686ffdb\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2 (api.ts, api.test.ts; backlog.md and agent-health file skipped as non-code)\n**Commits covered**: 686ffdb (fix/polish/AWD-L-85-dev-guard-console-error)\n**Issue**: AWD-L-85 — `console.error(\"Refresh failed\", e)` at `api.ts:75` not wrapped in DEV guard\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n| Test quality | 2 | 🟢 |\n\n## Findings\n\n### apps/frontend/src/services/api.ts\n- No issues. The single-line change at L75 (`if (import.meta.env.DEV) console.error(...)`) is correct and matches the established codebase pattern exactly (websocket.ts:51,62,67,73,78 and all admin/*.tsx files use the same inline guard form). Grep confirmed this is the only `console.*` call in the file.\n\n### apps/frontend/src/test/services/api.test.ts\n- **🟢 Low** Line 126: `vi.spyOn(apiService as any, 'refreshAccessToken')` — spy via `as any` on a private method is rename-brittle. Acceptable for an XS fix; no alternative without making the method internal-testable. Note for future: if `refreshAccessToken` is renamed, this test will silently degrade.\n- **🟢 Low** Line 137: Only the DEV=`true` path is asserted. The `!DEV` path (console.error not called in production builds) is not tested. Testing it would require mocking `import.meta.env.DEV`, which is non-trivial in vitest. Given the trivial one-line guard, the omission is acceptable.\n\n## Backlog Items Filed\nNone — both observations are pre-existing conditions or too minor for backlog items.\n\n## Notes\n- The `catch (e)` block at `api.ts:L74-76` is near-dead code in the current implementation: `refreshAccessToken()` has its own internal try-catch that returns `false` on any error, so the outer catch in `handleResponse` can only be triggered if `refreshAccessToken` itself throws (which is only testable via spy). The fix is still correct as defense-in-depth. This is a pre-existing structural note, not introduced by this diff. It is related to the broader `M-120` refactor backlog item.\n- `api.ts` is 872 lines — already tracked in `M-120` (split by domain). Not re-filed.\n- This is a clean, minimal fix. Zero scope creep.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-05-92ddd4d.md", "path": "../code-reviews/review-2026-07-05-92ddd4d.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-05", "content": "# Code Review — 2026-07-05 · 92ddd4d\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2 (package.json, package-lock.json — lock file skipped per policy)\n**Commits covered**: 92ddd4d\n**Issue**: AWD-L-38 — react-icons v4.12.0 → v5.7.0\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\nNone. The change is a one-line version bump in `package.json` and the corresponding lockfile update. No application code was modified.\n\n## Verification Performed\n\n- `fa` and `fi` sub-packages still present in react-icons v5.7.0 with identical import paths.\n- All 30 icon names used across 31 files (`FaShieldAlt`, `FaLock`, `FaChild`, `FaFacebook`, `FaTwitter`, `FaInstagram`, `FaLinkedin`, `FaHome`, `FaBookOpen`, `FaFolder`, `FaCog`, `FaSignOutAlt`, `FaBookmark`, `FaUsers`, `FaExclamationTriangle`, `FaTimes`, `FaRegBookmark`, `FaEye`, `FaEyeSlash`, `FaArrowLeft`, `FaEnvelope`, `FaPlus`, `FaEdit`, `FaTrash`, `FaGraduationCap`, `FaSchool`, `FaUser`, `FaCheckCircle`, `FaRobot`, `FaArrowRight`, and all `Fi*` icons) resolve without error in the installed v5.7.0 package.\n- `peerDependencies` remains `{\"react\": \"*\"}` — no new constraints introduced.\n- `npm audit --production` → 0 vulnerabilities.\n- TypeScript: 0 errors. Lint: 0 warnings. Frontend tests: 292/292 pass. Backend tests: 1003/1003 pass (2 skipped).\n\n## Backlog Items Filed\n\nNone.\n\n## Notes\n\nreact-icons v5 is additive relative to v4 for the `fa` and `fi` families. The `fa6` package (Font Awesome 6) was introduced as a new addition; the existing `fa` package (Font Awesome 4) is unchanged. No consumer code needed updating. Upgrade is clean and safe.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-03-AWD-M-317.md", "path": "../code-reviews/review-2026-07-03-AWD-M-317.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-03", "content": "# Code Review — 2026-07-03 · AWD-M-317\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2\n**Issue**: AWD-M-317 — Add rate limits to 12 unprotected endpoints in admin.py\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 1 | 🟢 |\n\n## Findings\n\n### apps/backend/routers/admin.py\n\n- **🟢 Low** Lines 68–75, 160–167, 203–209, 238–245, 269–276, 334–340: Six handlers that already had `request: Request` before this change have it in non-first parameter position (e.g. `update_user_status` has `user_id`, `user_update` before `request`). SlowAPI resolves `request` by name, not position, so rate limiting works correctly — this is a pre-existing style inconsistency, not introduced by M-317. New handlers added in this fix all have `request: Request` in first position.\n  Note: Pre-existing; M-317 introduced no new inconsistencies.\n\n### apps/backend/tests/test_admin_rate_limits.py\n\n- No findings. 26 tests covering all 12 endpoints: 12 parametrized `request` param checks, 1 type annotation check, 1 `request` non-optional guard (`admin_list_children`), 12 route-registration checks. Coverage is comprehensive.\n\n## Backlog Items Filed\n\nNone — the single 🟢 finding is pre-existing and out of scope for this fix.\n\n## Notes\n\n- Decorator order (`@router.xxx` outer / `@limiter.limit()` inner) is correct per M-314 convention across all 12 endpoints.\n- Rate limits are consistent with the established pattern: 60/minute for GET reads, 30/minute for POST/PATCH/DELETE writes.\n- `admin_list_children` correctly promoted `request: Request = None` → `request: Request` (required), closing the COPPA endpoint's implicit type safety gap.\n- `from apps.backend.limiter import limiter` import placement (after `get_db`, before models) follows the stdlib → third-party → local convention.\n- 1003 backend tests pass, 292 frontend tests pass, 0 TS errors, 0 lint errors.\n\n📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-03-8c7c4d6.md", "path": "../code-reviews/review-2026-07-03-8c7c4d6.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-03", "content": "# Code Review — 2026-07-03 · 8c7c4d6\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2\n**Commits covered**: 8c7c4d6\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\n### apps/backend/routers/lesson_plans.py\n\nNo findings. All 7 previously unprotected endpoints now carry `@limiter.limit()` with correct decorator order (outer `@router.xxx`, inner `@limiter.limit()`) per the M-314 convention. `request: Request` is correctly the first positional parameter in every handler. Rate limits are appropriate: 60/minute for GET reads, 30/minute for PUT/DELETE writes. The body parameter rename (`request → lesson_plan_data` in `update_lesson_plan`) is correct and necessary to avoid the FastAPI parameter collision.\n\n### apps/backend/tests/test_lesson_plan_rate_limits.py\n\nNo findings. Structural inspection tests cover all 10 endpoints (7 newly limited + 3 pre-existing regression guards). The parametrised `test_rate_limited_endpoint_has_request_parameter` pattern matches the established convention from analogous files (contexts, children, country). The extra `test_update_lesson_plan_body_param_renamed` test explicitly guards the parameter-name collision that was fixed.\n\n🟢 **Observation** (non-blocking): Tests verify `request: Request` presence and type annotation but do not inspect the `@limiter.limit()` decorator value string. This is consistent with the existing rate-limit test convention across the codebase and is acceptable — decorator introspection would require reaching into closure internals. No action needed.\n\n## Backlog Items Filed\n\nNone\n\n## Notes\n\nCorrect and consistent with the rate-limiting sweep (M-200, M-311, M-313, M-315). Implementation is XS in effort and follows the established pattern exactly. All 10 endpoints in `lesson_plans.py` are now uniformly protected.\n\n> 📝 **Feedback prompt**: If you revise this output significantly before using it, please log it —\n> `\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\n> Logs go t ompt**: If you revise this output significantly before using it, please log it —\n`\"Log feedback: code-review-agent output was [approved / revised / rejected] — [what changed]\"`\nLogs go to `docs/agentic/feedback-log.md` and improve future prompts.\n"}, {"title": "review-2026-07-01-593f703.md", "path": "../code-reviews/review-2026-07-01-593f703.md", "category": "Code review", "agent": "code-review-agent", "date": "2026-07-01", "content": "# Code Review — 2026-07-01 · 593f703\n\n**Verdict**: ✅ Clean\n**Files reviewed**: 2\n**Commits covered**: 593f703 (fix(security): AWD-L-84 use generic 403 detail in require_role/require_roles)\n\n## Summary Table\n\n| Category | Findings | Worst Severity |\n|----------|----------|----------------|\n| SOLID | 0 | — |\n| Complexity | 0 | — |\n| Duplication | 0 | — |\n| Coupling | 0 | — |\n| Naming | 0 | — |\n| Error Handling | 0 | — |\n| Security (structural) | 0 | — |\n| API Design | 0 | — |\n\n## Findings\n\n### apps/backend/dependencies.py\nNo findings. The change is two-line surgical: f-string interpolations at lines 200 and 220 replaced with the static string `\"Access denied.\"`. Surrounding function structure, error flow, and responsibility boundaries are unchanged.\n\n### apps/backend/tests/test_dependencies_role_403.py\nNo findings. The `sys.path.insert` block (lines 12–17) matches the project-standard pattern established in `conftest.py` — consistent, not a smell specific to this file. The 8 tests cover: happy path (matching role returns user), wrong role raises 403, detail is exactly `\"Access denied.\"`, and detail does not contain the internal role name/list. DI is bypassed correctly by calling the returned closure directly, which is the idiomatic unit-test pattern for FastAPI dependency factories.\n\n## Backlog Items Filed\nNone\n\n## Notes\n- The fix is minimal and correct. Removing the f-string leak closes AWD-L-84 cleanly.\n- `get_current_active_user` at line 181 still raises `detail=\"Account suspended\"` — this i
